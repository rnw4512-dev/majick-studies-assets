Assessment used during learning to provide feedback and guide instructional adjustments.","Summative":"Assessment used after a period of learning to evaluate achievement, often connected to a final grade.","Quantitative":"Numerical assessment data.","Qualitative":"Descriptive or narrative assessment data.","Norm-referenced":"Interprets performance relative to a comparison group.","Criterion-referenced":"Interprets performance against defined standards or mastery criteria.","Progress monitoring":"Frequent, ongoing measurement used to evaluate student response and growth.","Reliability":"Consistency of scores or ratings.","Validity":"Degree to which an assessment measures the intended construct for its intended use.","Relevance":"Degree to which the information directly addresses the concern or decision at hand.","Bias":"Systematic unfairness or construct-irrelevant barriers that disadvantage a group.","Duration":"The time span or repeated observation/testing period emphasized in a data set or course scenario.","MTSS":"Multi-Tiered System of Supports; a broader framework integrating academic, behavioral, and social-emotional supports.","RTI":"Response to Intervention; evaluates how a learner responds to evidence-based intervention.","SEL":"Social-emotional learning; includes self-awareness and responsible decision-making.","PBIS":"Positive Behavioral Interventions and Supports; a framework for proactive behavior support.","FERPA":"Federal law protecting education records and related parent/eligible-student access rights.","ADA":"Civil-rights law protecting people with disabilities from discrimination and supporting equal access.","IDEA":"Federal special education law governing evaluation, eligibility, IEPs, FAPE, and procedural protections.","Rowley":"Supreme Court case associated with FAPE and individualized educational benefit in special education."},"questionBank":[{"section":"assessments","prompt":"A teacher records how a learner participates during independent wo ewed":true,"keyClue":"First review what already exists; then identify the specific gap in scope, depth, fairness, currency, or relevance."},{"section":"law","prompt":"Which federal law protects education records and access rights?","options":["FERPA","ADA","IDEA","ESSA"],"answer":"FERPA","why":"FERPA governs education-record privacy/access.","id":"base_46","topicId":"laws","difficulty":1,"format":"scenario","distractorCoach":"Choose the law tied to the exact right at issue, not simply the law that sounds most related to disability.","qualityReviewed":true,"keyClue":"Education-record privacy \u2192 FERPA. Disability access/non-discrimination \u2192 ADA."},{"section":"law","prompt":"Which law is most directly associated with disability nondiscrimination and equal access across public life?","options":["ADA","FERPA","ESSA","Title I"],"answer":"ADA","why":"ADA is a civil-rights disability law.","id":"base_47","topicId":"laws","difficulty":2,"format":"scenario","distractorCoach":"Choose the law tied to the exact right at issue, not simply the law that sounds most related to disability.","qualityReviewed":true,"keyClue":"Education-record privacy \u2192 FERPA. Disability access/non-discrimination \u2192 ADA."},{"section":"law","prompt":"A student's difficulties align with a suspected IDEA disability and significantly affect participation. What is the appropriate next step?","options":["Formal special education evaluation referral","Intensify general-education intervention before initiating any formal evaluation","Continue the current targeted intervention for another cycle while collecting more data","Provide informal accommodations without initiating an evaluation"],"answer":"Formal special education evaluation referral","why":"A suspected disability can trigger the evaluation/referral process.","id":"base_48","topicId":"mtss_components","difficulty":2,"format":"scenario","distractorCoach":"Several MTSS terms can be true in the same case. Choose the one that matches the s ions that are true in general but do not answer the exact question being asked.","qualityReviewed":true,"keyClue":"Rowley \u2192 individualized educational benefit. Persistent lack of progress despite appropriate intervention \u2192 referral indicator."},{"section":"law","prompt":"A student needs accessible assessment materials because of a disability. Which legal idea is most directly implicated among these choices?","options":["ADA equal access","FERPA records","RTI","Summative assessment"],"answer":"ADA equal access","why":"ADA focuses on nondiscrimination and access.","id":"base_57","topicId":"laws","difficulty":2,"format":"scenario","distractorCoach":"Choose the law tied to the exact right at issue, not simply the law that sounds most related to disability.","qualityReviewed":true,"keyClue":"Education-record privacy \u2192 FERPA. Disability access/non-discrimination \u2192 ADA."},{"section":"law","prompt":"The IAT is reviewing whether targeted interventions helped before considering referral. This supports...","options":["Data-based decision making","Automatic disability identification","Peer nomination","Grade retention only"],"answer":"Data-based decision making","why":"Referral decisions should be supported by relevant data.","id":"base_58","topicId":"law_mixed","difficulty":1,"format":"scenario","distractorCoach":"Choose the law tied to the exact right at issue, not simply the law that sounds most related to disability.","qualityReviewed":true,"keyClue":"Identify the legal issue in the stem before choosing the law or case."},{"section":"law","prompt":"Which phrase is the strongest legal/referral clue for IDEA evaluation?","options":["Suspected disability affecting learning/participation","Needs a higher grade","Missed one assignment","Dislikes one subject"],"answer":"Suspected disability affecting learning/participation","why":"Suspicion of disability and educational impact are central.","id":"base_59","topicId":"mtss_components","difficulty":2,"format":"scenario","distractorCoach":"Several MTSS terms can be true in the same case. Choose the one that matches the specific evidence named in the stem.","qualityReviewed":true,"keyClue":"Response to intervention \u2192 RTI. Performance gap \u2192 discrepancy. Self-awareness/decision-making \u2192 SEL. Behavior-system supports/data \u2192 PBIS."},{"section":"law","prompt":"A school psychologist reports behavior consistent with a suspected disability under IDEA. What should the team avoid?","options":["Unnecessarily postponing formal evaluation solely to keep trying interventions","Documenting the concern","Using multiple data sources","Including relevant stakeholders"],"answer":"Unnecessarily postponing formal evaluation solely to keep trying interventions","why":"Intervention should not become an inappropriate barrier to evaluation.","id":"base_60","topicId":"reliability","difficulty":2,"format":"scenario","distractorCoach":"The closest trap is usually validity: a test can be consistent and still measure the wrong construct.","qualityReviewed":true,"keyClue":"Consistency/repeatability/rater agreement \u2192 reliability."},{"concept":"quality","difficulty":5,"prompt":"Two teachers use the same behavior scale and produce nearly identical ratings, but the scale mostly captures oppositional behavior even though the referral concern is anxiety. Which conclusion is BEST?","options":["The scale is reliable but its validity/relevance to the anxiety concern is questionable","The scale is valid because the raters agree","The scale is biased because two teachers completed it","The scale is summative because it was completed twice"],"answer":"The scale is reliable but its validity/relevance to the anxiety concern is questionable","why":"Agreement supports reliability, but consistency does not prove the instrument measures the intended anxiety-related construct or addresses the referral concern.","clue":"Separate CONSISTENCY from WHAT/WHY the instrument measures.","section":"quality"," guarantees eligibility for special education","It eliminates the need to consider bias","It makes every measure criterion-referenced"],"answer":"It triangulates qualitative and quantitative evidence across methods and time","why":"Multiple measures provide converging evidence and reduce dependence on the limitations of any single tool.","clue":"Look for MULTIPLE SOURCES + DIFFERENT METHODS + TIME.","section":"assessments","id":"hard_6","topicId":"quant_qual","format":"transfer","distractorCoach":"Eliminate options that are true in general but do not answer the exact question being asked.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Numbers/counts/scores \u2192 quantitative. Descriptions/perspectives/context \u2192 qualitative."},{"concept":"prereferral","difficulty":5,"prompt":"A team has strong behavior data but weak academic data, yet the initial concern includes both behavior and reading. What is the best next step?","options":["Assess the scope and depth of existing data and collect targeted academic information","Discard the behavior data because it is not academic","Refer immediately without addressing the missing academic evidence","Repeat every assessment with a different administrator"],"answer":"Assess the scope and depth of existing data and collect targeted academic information","why":"The data set should adequately address the full concern. Existing evidence is reviewed first, then missing relevant data are collected.","clue":"Coverage matters: does the evidence address ALL parts of the concern?","section":"prereferral","id":"hard_7","topicId":"prereferral_steps","format":"transfer","distractorCoach":"Eliminate options that are true in general but do not answer the exact question being asked.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Follow the sequence: concern \u2192 gather information \u2192 team \u2192 plan \u2192 implement \u2192 evaluate/review."},{"concept":"law","difficulty":5,"prompt":"Which statement best reflects the educational principle associated with Rowley in the context of this course?","options":["Interventions and individualized programming must be designed to provide educational benefit","The school must maximize each student\u2019s potential to the greatest possible degree","The IEP must guarantee grade-level academic performance","Students with similar disability labels should receive substantially identical services"],"answer":"Interventions and individualized programming must be designed to provide educational benefit","why":"Your pre-assessment keyed Rowley to individualized supports designed to confer educational benefit, not a behavior-specific rule.","clue":"ROWLEY \u2192 individualized educational benefit/FAPE.","section":"law","id":"hard_8","topicId":"rowley_referral","format":"transfer","distractorCoach":"Eliminate options that are true in general but do not answer the exact question being asked.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Rowley \u2192 individualized educational benefit. Persistent lack of progress despite appropriate intervention \u2192 referral indicator."},{"id":"v412_assess_1","topicId":"assessment_methods","section":"assessments","prompt":"An IAT already has several test scores but still does not know how a student approaches independent work in the general classroom. Which additional source would best fill that gap?","options":["Classroom observation","Another standardized test","A portfolio score","A final examination"],"answer":"Classroom observation","why":"Direct observation adds contextual evidence about how the student actually behaves and performs during classroom tasks.","difficulty":4,"format":"error_analysis","distractorCoach":"Another formal score may be valid information, but it does not answer the missing contextual question.","qualityReviewed":true,"keyClue":"When the missing information is what actually happens in the classroom, think observation."},{"id":"v412_assess_2","topicId":"assessment_methods","section":"assessments","prompt":"A team wants to understand why a student avoids reading aloud. They already have classroom observations and work samples. Which additional assessment method would add the student's own perspective?","options":["Interview","Portfolio","Screening","Scaled checklist"],"answer":"Interview","why":"An interview can gather the student's explanation, perceptions, and experiences that are not visible in work samples or observation alone.","difficulty":5,"format":"transfer","distractorCoach":"A scaled checklist can rate behavior, but it does not necessarily explain the student's own reasoning or experience.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Ask which source can provide a perspective that cannot be directly observed."},{"id":"v412_quant_1","topicId":"quant_qual","section":"assessments","prompt":"A pre-referral file contains weekly accuracy percentages, a frequency count of call-outs, teacher narrative notes, and a caregiver interview. Which statement best describes the evidence?","options":["It combines quantitative and qualitative data","It is entirely quantitative","It is entirely qualitative","It is summative evidence only"],"answer":"It combines quantitative and qualitative data","why":"Percentages and counts are quantitative, while narrative notes and interview responses are qualitative. Using both can provide performance data and context.","difficulty":5,"format":"transfer","distractorCoach":"Do not classify the entire file from just one source; mixed evidence can contain both numerical and descriptive data.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Separate the type of data from the assessment method: numbers and descriptions can appear in the same file."},{"id":"v412_norm_1","topicId":"norm_criterion","section":"assessments","prompt":"A reading report states that a student mastered 9 of 12 grade-level skills and also scored at the 38th percentile nationally. Which interpretation is accurate?","options":["The report contains both criterion-referenced and norm-referenced information","The report is only criterion-referenced","The report is only norm-referenced","The percentile makes the mastery result invalid"],"answer":"The report contains both criterion-referenced and norm-referenced information","why":"Mastery of defined skills is criterion-referenced information, while percentile rank compares performance with a norm group.","difficulty":5,"format":"transfer","distractorCoach":"Do not assume the whole assessment must use only one interpretation when the report explicitly provides both.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"One report can contain two different reference frames; ask what each score is compared against."},{"id":"v412_pm_1","topicId":"progress_monitoring","section":"assessments","prompt":"A teacher gives a reading probe every Friday for eight weeks and graphs each result against the student's goal. What makes this progress monitoring rather than a one-time benchmark?","options":["The repeated measurements show change over time","The scores are numerical","The probe is given on Friday","The student has a goal"],"answer":"The repeated measurements show change over time","why":"Progress monitoring depends on repeated, ongoing measurement so a team can evaluate growth and intervention response.","difficulty":3,"format":"discrimination","distractorCoach":"A numerical score alone does not make an assessment progress monitoring.","qualityReviewed":true,"keyClue":"Ongoing + repeated + trend over time are the central clues."},{"id":"v412_pm_2","topicId":"progress_monitoring","section":"assessments","prompt":"A student starts an intervention at 42% accuracy and reaches 44%, 43%, 45%, 44%, and 46% over five checks while the goal is 70%. Which interpretation is strongest?","options":["Growth is minimal and the intervention should be reviewed","Continue the intervention unchanged because the scores show an upward trend","Increase intensity immediately because the current score remains below the goal","Extend monitoring before making any change because five checks may not establish a stable pattern"],"answer":"Growth is minimal and the intervention should be reviewed","why":"The repeated data show little movement toward the goal. The team should review the intervention and relevant implementation evidence rather than treat the pattern as automatic eligibility.","difficulty":5,"format":"transfer","distractorCoach":"A small increase can sound positive, but adequate response requires meaningful progress toward the target.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Judge the trend against the goal, not whether the final score is slightly higher than baseline."},{"id":"v412_pm_3","topicId":"progress_monitoring","section":"assessments","prompt":"Which situation would make progress-monitoring results difficult to interpret even though data were collected weekly?","options":["Administration procedures changed from week to week","The data were graphed","A goal line was included","The measure produced numerical scores"],"answer":"Administration procedures changed from week to week","why":"Changing administration procedures can introduce inconsistency, making score changes harder to attribute to student progress.","difficulty":4,"format":"error_analysis","distractorCoach":"Frequency of measurement does not compensate for unreliable administration.","qualityReviewed":true,"keyClue":"Repeated data are only useful when measurement conditions are sufficiently consistent."},{"id":"v412_pm_4","topicId":"progress_monitoring","section":"assessments","prompt":"A team has six weeks of stable progress-monitoring data showing improvement that closely approaches the goal. What is the most defensible next step?","options":["Continue the effective support while monitoring progress","Reduce the support because the student is approaching the goal","Increase intervention intensity so the student reaches the goal faster","Move to less frequent monitoring because the data are stable"],"answer":"Continue the effective support while monitoring progress","why":"When data show an adequate response, continuing the successful intervention while monitoring is more defensible than treating referral as automatic.","difficulty":5,"format":"transfer","distractorCoach":"Referral is not the goal of MTSS; the goal is effective support based on data.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Progress monitoring informs decisions in both directions: lack of response may prompt review, while adequate response supports continuation."},{"id":"v412_pm_5","topicId":"progress_monitoring","section":"assessments","prompt":"Why is a baseline score useful but insufficient by itself for evaluating an intervention?","options":["It establishes a starting point but does not show a trend","It shows initial severity but does not indicate how the student responds to intervention","It can be compared with a benchmark but does not show implementation fidelity","It describes current performance but does not establish whether later change is instructionally meaningful"],"answer":"It establishes a starting point but does not show a trend","why":"Baseline provides the point of comparison. Repeated measures after intervention are needed to determine whether performance changes over time.","difficulty":2,"format":"scenario","distractorCoach":"Do not confuse having a starting score with actually monitoring change.","qualityReviewed":true,"keyClue":"Baseline = starting point; progress monitoring = repeated evidence after that point."},{"id":"v412_pre_mix1","topicId":"prereferral_mixed","section":"prereferral","prompt":"A team has documented a reading concern and reviewed existing data. What should happen before the intervention is implemented?","options":["The team should meet and develop a specific plan","The team should collect additional data before discussing an intervention plan","The intervention should begin immediately and the formal plan can be written after the first progress check","The student should be referred for a comprehensive evaluation before the team selects a targeted intervention"],"answer":"The team should meet and develop a specific plan","why":"After information gathering, stakeholders discuss the evidence and develop the intervention plan before implementation.","difficulty":3,"format":"discrimination","distractorCoach":"Several choices may describe legitimate school actions; choose the one that fits the current step and evidence.","qualityReviewed":true,"keyClue":"Identify where the team is in the process and what evidence the decision requires."},{"id":"v412_pre_mix2","topicId":"prereferral_mixed","section":"prereferral","prompt":"A student receives targeted intervention with fidelity, but progress-monitoring data remain flat across six weeks. Which action best reflects data-based pre-referral decision-making?","options":[ aluating the quality of the evidence already available"],"answer":"Identify the concern, check measurement quality, compare with other relevant data, then decide whether more evidence is needed","why":"Sound evaluation considers the decision question, quality of the measure, and convergence across multiple relevant sources.","difficulty":5,"format":"transfer","distractorCoach":"The trap is choosing a quality term that is true in general but not the main problem in this scenario.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Separate reliability, validity, relevance, bias, and duration before deciding which issue is primary."},{"id":"v412_law_mix1","topicId":"law_mixed","section":"law","prompt":"A parent requests access to the student's education records during a referral process. Which law most directly governs that request?","options":["FERPA","ADA","Rowley","PBIS"],"answer":"FERPA","why":"FERPA protects education-record privacy and gives parents eligible rights to inspect records.","difficulty":2,"format":"scenario","distractorCoach":"A complex stem may mention several laws; choose the one tied to the exact right or next action being asked about.","qualityReviewed":true,"keyClue":"Separate privacy, access, educational benefit, and referral/evaluation responsibilities."},{"id":"v412_law_mix2","topicId":"law_mixed","section":"law","prompt":"A student with a disability cannot access required graphical information because no accessible alternative is provided. Which principle is most directly implicated?","options":["ADA equal access/non-discrimination","FERPA record privacy","Rowley educational benefit only","Criterion-referenced testing"],"answer":"ADA equal access/non-discrimination","why":"The barrier concerns equal access to the assessment, not confidentiality of records.","difficulty":3,"format":"discrimination","distractor  asked about.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Separate privacy, access, educational benefit, and referral/evaluation responsibilities."},{"id":"v412_law_mix5","topicId":"law_mixed","section":"law","prompt":"A student shows persistent lack of progress despite appropriate intervention, and the school psychologist identifies a suspected IDEA disability. Which next action is best supported?","options":["Make a formal referral for special education evaluation","Wait indefinitely for another report card","Write an IEP without evaluation","Use FERPA to determine eligibility"],"answer":"Make a formal referral for special education evaluation","why":"Documented need plus suspected disability supports formal evaluation; eligibility and an IEP come after the appropriate evaluation process.","difficulty":5,"format":"transfer","distractorCoach":"A complex stem may mention several laws; choose the one tied to the exact right or next action being asked about.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Separate privacy, access, educational benefit, and referral/evaluation responsibilities."}],"misconceptionCatalog":[{"id":"reliability_vs_validity","label":"Reliability \u2194 Validity","topics":["reliability","validity_relevance"],"repair":"Consistency does not prove the intended construct is measured."},{"id":"norm_vs_criterion","label":"Norm \u2194 Criterion","topics":["norm_criterion"],"repair":"Norm = peers; criterion = a defined standard or skill."},{"id":"formative_vs_informal","label":"Formative \u2194 Informal","topics":["formative_summative","assessment_methods"],"repair":"Formative describes purpose; informal describes structure/method."},{"id":"rti_vs_discrepancy","label":"RTI \ ,"End-of-unit/high-stakes/final evaluation","SUMS up"],["Quantitative","Numerical scores, frequency, percentages, cut scores","QUANTITY = numbers"],["Qualitative","Descriptions, interviews, observations, narratives","QUALITY = description"],["Progress monitoring","Frequent repeated measurement to evaluate response/growth","REPEAT data"]],"trap":"Informal describes structure. Formative describes PURPOSE. Questions may place both in the same answer set."},{"id":"norm_criterion","title":"Norm vs. Criterion","icon":"\u2696\ufe0f","concepts":["norm_criterion"],"summary":"Identify what the student's performance is being compared against.","rows":[["Norm-referenced","Performance compared with a peer/norm group","NORM = people"],["Criterion-referenced","Performance compared with a defined standard, skill, or criterion","CRITERIA = standard"]],"trap":"Words such as national sample, percentile, or peers point to norm. Mastery, standard, benchmark, or defined performance level point to criterion."},{"id":"prereferral","title":"Six Pre-Referral Steps","icon":"\ud83e\ude84","concepts":["prereferral_steps","prereferral_mixed","additional_data"],"summary":"Assessment scenarios often ask what happens NEXT. Memorize the sequence, then use the scenario clue rather than guessing.","rows":[["1. Initial concern","Problem is recognized, documented, and shared","NOTICE"],["2. Information gathering","Collect and review existing data","GATHER"],["3. Team meeting","Stakeholders discuss needs and performance","TALK"],["4. Plan development","Choose strategies/interventions and define the plan","PLAN"],["5. Implementation","Carry out the intervention","DO"],["6. Evaluation & review","Review effectiveness and adjust as needed","REVIEW"]],"trap":"Do not jump to implementation before the team has gathered information and developed a plan."},{"id":"mtss","title":"MTSS, RTI, SEL & PBIS","icon":"\ud83c\udf1f","concepts":["mtss_components","additional_data"],"summary":"Know the role of each framework/ cess rights","FILES / RECORDS"],["ADA","Equal access and nondiscrimination for individuals with disabilities","ACCESS"],["IDEA referral","Suspected disability affecting learning/participation should lead to appropriate evaluation","SUSPECT \u2192 EVALUATE"],["Referral indicator","Documented lack of progress despite targeted interventions can support referral/evaluation","TARGETED + LITTLE PROGRESS"],["Rowley (1982)","FAPE and an individualized program reasonably designed to provide educational benefit","EDUCATIONAL BENEFIT"]],"trap":"Do not delay an appropriate evaluation indefinitely just to keep trying interventions. Rowley is broader than one behavior strategy."},{"id":"test_strategy","title":"Multiple-Choice Strategy","icon":"\ud83e\udebd","concepts":[],"summary":"Your job is not to prove every option is false. Your job is to choose the option that MOST directly answers the exact question.","rows":[["1","Read the LAST sentence first","Know the task"],["2","Find the controlling clue","Purpose? numbers? peers? consistency? law?"],["3","Eliminate the wrong category","Remove answers that answer a different question"],["4","Compare the last two","Which option matches the exact course wording and scenario?"],["5","Only change with evidence","Do not change because an answer feels too easy"]],"trap":"When two answers are true in general, choose the one that is most directly supported by the scenario and the exact question asked."}],"sources":[{"name":"WGU course materials","note":"Use your WGU course of study as the terminology authority.","url":""},{"name":"U.S. Department of Education \u2014 IDEA","note":"Federal special-education law and regulations.","url":"https://sites.ed.gov/idea/"},{"name":"IRIS Center \u2014 Vanderbilt University","note":"Evidence-based special-education learning modules and examples.","url":"https://iris.peabody.vanderbilt.edu/"},{"name":"National Center on Intensive Intervention","note":"Progress monitoring and intensive intervention resource ment best reflects FERPA?","options":["Parents/eligible students have rights regarding education records","It creates MTSS tiers","It defines scaled checklists","It requires norm-referenced tests"],"answer":"Parents/eligible students have rights regarding education records","why":"FERPA centers on education records.","id":"base_52","topicId":"laws","difficulty":2,"format":"scenario","distractorCoach":"Choose the law tied to the exact right at issue, not simply the law that sounds most related to disability.","qualityReviewed":true,"keyClue":"Education-record privacy → FERPA. Disability access/non-discrimination → ADA."},{"section":"law","prompt":"Which statement best reflects ADA in the referral context?","options":["Assessment access should not unfairly disadvantage a student because of disability","It makes every struggling student IDEA-eligible","It replaces IDEA","It governs report-card grades"],"answer":"Assessment access should not unfairly disadvantage a student because of disability","why":"ADA supports equal access/nondiscrimination.","id":"base_53","topicId":"bias_access","difficulty":2,"format":"scenario","distractorCoach":"Eliminate options that are true in general but do not answer the exact question being asked.","qualityReviewed":true,"keyClue":"Unfair construct-irrelevant cultural, linguistic, or access barrier → bias/access concern."},{"section":"law","prompt":"A school keeps trying new interventions for months despite strong evidence of a suspected disability. What is the concern?","options":["Interventions should not be used to improperly delay an appropriate evaluation","FERPA requires more delay","Only summative tests count","Referral can occur only after suspension"],"answer":"Interventions should not be used to improperly delay an appropriate evaluation","why":"A suspected disability calls for appropriate evaluation procedures rather than indefinite delay.","id":"base_54","topicId":"rowley_referral","difficulty":2,"format":"scenario","distractorCoach":"Eliminate options that are true in general but do not answer the exact question being asked.","qualityReviewed":true,"keyClue":"Rowley → individualized educational benefit. Persistent lack of progress despite appropriate intervention → referral indicator."},{"section":"law","prompt":"Which evidence is LEAST sufficient by itself for referral?","options":["A peer says the student needs special education","Documented lack of progress","Persistent disability-related concerns","Multiple relevant data sources"],"answer":"A peer says the student needs special education","why":"Peer opinion alone is not adequate evidence.","id":"base_55","topicId":"mtss_components","difficulty":2,"format":"scenario","distractorCoach":"Several MTSS terms can be true in the same case. Choose the one that matches the specific evidence named in the stem.","qualityReviewed":true,"keyClue":"Response to intervention → RTI. Performance gap → discrepancy. Self-awareness/decision-making → SEL. Behavior-system supports/data → PBIS."},{"section":"law","prompt":"Which concept connects Rowley most directly to practice?","options":["Individualized educational benefit","Data privacy","Scaled behavior frequency","Portfolio scoring"],"answer":"Individualized educational benefit","why":"Rowley is a FAPE/educational-benefit case.","id":"base_56","topicId":"rowley_referral","difficulty":2,"format":"scenario","distractorCoach":"Eliminate options that are true in general but do not answer the exact question being asked.","qualityReviewed":true,"keyClue":"Rowley → individualized educational benefit. Persistent lack of progress despite appropriate intervention → referral indicator."},{"section":"law","prompt":"A student needs accessible assessment materials because of a disability. Which legal idea is most directly implicated among these choices?","options":["ADA equal access","FERPA records","RTI","Summative assessment"],"answer":"ADA equal access","why":"ADA focuses on nondiscrimination and access.","id":"base_57","topicId":"laws","difficulty":2,"format":"scenario","distractorCoach":"Choose the law tied to the exact right at issue, not simply the law that sounds most related to disability.","qualityReviewed":true,"keyClue":"Education-record privacy → FERPA. Disability access/non-discrimination → ADA."},{"section":"law","prompt":"The IAT is reviewing whether targeted interventions helped before considering referral. This supports...","options":["Data-based decision making","Automatic disability identification","Peer nomination","Grade retention only"],"answer":"Data-based decision making","why":"Referral decisions should be supported by relevant data.","id":"base_58","topicId":"law_mixed","difficulty":1,"format":"scenario","distractorCoach":"Choose the law tied to the exact right at issue, not simply the law that sounds most related to disability.","qualityReviewed":true,"keyClue":"Identify the legal issue in the stem before choosing the law or case."},{"section":"law","prompt":"Which phrase is the strongest legal/referral clue for IDEA evaluation?","options":["Suspected disability affecting learning/participation","Needs a higher grade","Missed one assignment","Dislikes one subject"],"answer":"Suspected disability affecting learning/participation","why":"Suspicion of disability and educational impact are central.","id":"base_59","topicId":"mtss_components","difficulty":2,"format":"scenario","distractorCoach":"Several MTSS terms can be true in the same case. Choose the one that matches the specific evidence named in the stem.","qualityReviewed":true,"keyClue":"Response to intervention → RTI. Performance gap → discrepancy. Self-awareness/decision-making → SEL. Behavior-system supports/data → PBIS."},{"section":"law","prompt":"A school psychologist reports behavior consistent with a suspected disability under IDEA. What should the team avoid?","options":["Unnecessarily postponing formal evaluation solely to keep trying interventions","Documenting the concern","Using multiple data sources","Including relevant stakeholders"],"answer":"Unnecessarily postponing formal evaluation solely to keep trying interventions","why":"Intervention should not become an inappropriate barrier to evaluation.","id":"base_60","topicId":"reliability","difficulty":2,"format":"scenario","distractorCoach":"The closest trap is usually validity: a test can be consistent and still measure the wrong construct.","qualityReviewed":true,"keyClue":"Consistency/repeatability/rater agreement → reliability."},{"concept":"quality","difficulty":5,"prompt":"Two teachers use the same behavior scale and produce nearly identical ratings, but the scale mostly captures oppositional behavior even though the referral concern is anxiety. Which conclusion is BEST?","options":["The scale is reliable but its validity/relevance to the anxiety concern is questionable","The scale is valid because the raters agree","The scale is biased because two teachers completed it","The scale is summative because it was completed twice"],"answer":"The scale is reliable but its validity/relevance to the anxiety concern is questionable","why":"Agreement supports reliability, but consistency does not prove the instrument measures the intended anxiety-related construct or addresses the referral concern.","clue":"Separate CONSISTENCY from WHAT/WHY the instrument measures.","section":"quality","id":"hard_1","topicId":"reliability","format":"transfer","distractorCoach":"The closest trap is usually validity: a test can be consistent and still measure the wrong construct.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Consistency/repeatability/rater agreement → reliability."},{"concept":"assessment","difficulty":5,"prompt":"A district benchmark reports both the percent of grade-level standards mastered and a national percentile rank. Which statement is MOST accurate?","options":["The same assessment can support criterion-referenced and norm-referenced interpretations","The assessment must be only criterion-referenced","The assessment must be only norm-referenced","Percentile rank makes the assessment qualitative"],"answer":"The same assessment can support criterion-referenced and norm-referenced interpretations","why":"One score can be interpreted against standards while another compares performance with a norm group.","clue":"Ask what the SCORE is being compared with, not just what the test is called.","section":"assessments","id":"hard_2","topicId":"norm_criterion","format":"transfer","distractorCoach":"Both can use numerical scores. The deciding feature is what performance is compared against.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Peers/norm group/percentile → norm-referenced. Defined standard/mastery target → criterion-referenced."},{"concept":"prereferral","difficulty":5,"prompt":"An intervention appears ineffective, but records show it was delivered only twice per week even though the plan required daily implementation. What should the team do BEFORE concluding the student needs a more intensive intervention?","options":["Verify and correct implementation fidelity","Increase the intervention intensity immediately based on the inadequate response","Administer a supplemental diagnostic assessment before reviewing fidelity","Extend the current intervention cycle to obtain a longer progress trend"],"answer":"Verify and correct implementation fidelity","why":"The team cannot fairly judge intervention effectiveness until it knows the plan was implemented as intended.","clue":"Before changing the student, check whether the INTERVENTION was actually delivered.","section":"prereferral","id":"hard_3","topicId":"prereferral_steps","format":"transfer","distractorCoach":"Eliminate options that are true in general but do not answer the exact question being asked.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Follow the sequence: concern → gather information → team → plan → implement → evaluate/review."},{"concept":"law","difficulty":5,"prompt":"A student has persistent academic difficulties despite targeted interventions. The team suspects a disability. Which action best aligns with IDEA and the pre-referral evidence?","options":["Make a formal referral for a comprehensive special education evaluation","Continue the same ineffective intervention indefinitely","Wait for a suspension before referring","Use one IQ test as the sole eligibility measure"],"answer":"Make a formal referral for a comprehensive special education evaluation","why":"Documented lack of progress despite targeted interventions plus suspected disability supports referral; evaluation must be comprehensive and use multiple measures.","clue":"Suspected disability + documented lack of progress → formal evaluation referral.","section":"law","id":"hard_4","topicId":"rowley_referral","format":"transfer","distractorCoach":"Eliminate options that are true in general but do not answer the exact question being asked.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Rowley → individualized educational benefit. Persistent lack of progress despite appropriate intervention → referral indicator."},{"concept":"quality","difficulty":5,"prompt":"A reading test produces stable scores across three administrations. However, English learners score lower mainly because several passages rely on unfamiliar U.S. idioms unrelated to the reading skill being evaluated. Which TWO concerns are strongest?","options":["Bias and validity","Reliability and duration","Formative purpose and reliability","Relevance and summative purpose"],"answer":"Bias and validity","why":"The cultural/linguistic barrier creates unfairness (bias) and introduces construct-irrelevant language demands that threaten whether the test measures the intended reading skill (validity).","clue":"Hard questions may legitimately involve more than one quality concept—identify the PRIMARY mechanisms.","section":"quality","id":"hard_5","topicId":"validity_relevance","format":"transfer","distractorCoach":"Do not treat validity, relevance, and reliability as synonyms. Ask whether the issue is construct accuracy, fit to this concern, or consistency.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Measures intended construct → validity. Directly addresses this concern/decision → relevance."},{"concept":"assessment","difficulty":5,"prompt":"A teacher observes a student during math, interviews the caregiver, reviews six weeks of work samples, and graphs weekly computation probes. Why is this stronger than relying on one standardized score?","options":["It triangulates qualitative and quantitative evidence across methods and time","It guarantees eligibility for special education","It eliminates the need to consider bias","It makes every measure criterion-referenced"],"answer":"It triangulates qualitative and quantitative evidence across methods and time","why":"Multiple measures provide converging evidence and reduce dependence on the limitations of any single tool.","clue":"Look for MULTIPLE SOURCES + DIFFERENT METHODS + TIME.","section":"assessments","id":"hard_6","topicId":"quant_qual","format":"transfer","distractorCoach":"Eliminate options that are true in general but do not answer the exact question being asked.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Numbers/counts/scores → quantitative. Descriptions/perspectives/context → qualitative."},{"concept":"prereferral","difficulty":5,"prompt":"A team has strong behavior data but weak academic data, yet the initial concern includes both behavior and reading. What is the best next step?","options":["Assess the scope and depth of existing data and collect targeted academic information","Discard the behavior data because it is not academic","Refer immediately without addressing the missing academic evidence","Repeat every assessment with a different administrator"],"answer":"Assess the scope and depth of existing data and collect targeted academic information","why":"The data set should adequately address the full concern. Existing evidence is reviewed first, then missing relevant data are collected.","clue":"Coverage matters: does the evidence address ALL parts of the concern?","section":"prereferral","id":"hard_7","topicId":"prereferral_steps","format":"transfer","distractorCoach":"Eliminate options that are true in general but do not answer the exact question being asked.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Follow the sequence: concern → gather information → team → plan → implement → evaluate/review."},{"concept":"law","difficulty":5,"prompt":"Which statement best reflects the educational principle associated with Rowley in the context of this course?","options":["Interventions and individualized programming must be designed to provide educational benefit","The school must maximize each student’s potential to the greatest possible degree","The IEP must guarantee grade-level academic performance","Students with similar disability labels should receive substantially identical services"],"answer":"Interventions and individualized programming must be designed to provide educational benefit","why":"Your pre-assessment keyed Rowley to individualized supports designed to confer educational benefit, not a behavior-specific rule.","clue":"ROWLEY → individualized educational benefit/FAPE.","section":"law","id":"hard_8","topicId":"rowley_referral","format":"transfer","distractorCoach":"Eliminate options that are true in general but do not answer the exact question being asked.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Rowley → individualized educational benefit. Persistent lack of progress despite appropriate intervention → referral indicator."},{"id":"v412_assess_1","topicId":"assessment_methods","section":"assessments","prompt":"An IAT already has several test scores but still does not know how a student approaches independent work in the general classroom. Which additional source would best fill that gap?","options":["Classroom observation","Another standardized test","A portfolio score","A final examination"],"answer":"Classroom observation","why":"Direct observation adds contextual evidence about how the student actually behaves and performs during classroom tasks.","difficulty":4,"format":"error_analysis","distractorCoach":"Another formal score may be valid information, but it does not answer the missing contextual question.","qualityReviewed":true,"keyClue":"When the missing information is what actually happens in the classroom, think observation."},{"id":"v412_assess_2","topicId":"assessment_methods","section":"assessments","prompt":"A team wants to understand why a student avoids reading aloud. They already have classroom observations and work samples. Which additional assessment method would add the student's own perspective?","options":["Interview","Portfolio","Screening","Scaled checklist"],"answer":"Interview","why":"An interview can gather the student's explanation, perceptions, and experiences that are not visible in work samples or observation alone.","difficulty":5,"format":"transfer","distractorCoach":"A scaled checklist can rate behavior, but it does not necessarily explain the student's own reasoning or experience.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Ask which source can provide a perspective that cannot be directly observed."},{"id":"v412_quant_1","topicId":"quant_qual","section":"assessments","prompt":"A pre-referral file contains weekly accuracy percentages, a frequency count of call-outs, teacher narrative notes, and a caregiver interview. Which statement best describes the evidence?","options":["It combines quantitative and qualitative data","It is entirely quantitative","It is entirely qualitative","It is summative evidence only"],"answer":"It combines quantitative and qualitative data","why":"Percentages and counts are quantitative, while narrative notes and interview responses are qualitative. Using both can provide performance data and context.","difficulty":5,"format":"transfer","distractorCoach":"Do not classify the entire file from just one source; mixed evidence can contain both numerical and descriptive data.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Separate the type of data from the assessment method: numbers and descriptions can appear in the same file."},{"id":"v412_norm_1","topicId":"norm_criterion","section":"assessments","prompt":"A reading report states that a student mastered 9 of 12 grade-level skills and also scored at the 38th percentile nationally. Which interpretation is accurate?","options":["The report contains both criterion-referenced and norm-referenced information","The report is only criterion-referenced","The report is only norm-referenced","The percentile makes the mastery result invalid"],"answer":"The report contains both criterion-referenced and norm-referenced information","why":"Mastery of defined skills is criterion-referenced information, while percentile rank compares performance with a norm group.","difficulty":5,"format":"transfer","distractorCoach":"Do not assume the whole assessment must use only one interpretation when the report explicitly provides both.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"One report can contain two different reference frames; ask what each score is compared against."},{"id":"v412_pm_1","topicId":"progress_monitoring","section":"assessments","prompt":"A teacher gives a reading probe every Friday for eight weeks and graphs each result against the student's goal. What makes this progress monitoring rather than a one-time benchmark?","options":["The repeated measurements show change over time","The scores are numerical","The probe is given on Friday","The student has a goal"],"answer":"The repeated measurements show change over time","why":"Progress monitoring depends on repeated, ongoing measurement so a team can evaluate growth and intervention response.","difficulty":3,"format":"discrimination","distractorCoach":"A numerical score alone does not make an assessment progress monitoring.","qualityReviewed":true,"keyClue":"Ongoing + repeated + trend over time are the central clues."},{"id":"v412_pm_2","topicId":"progress_monitoring","section":"assessments","prompt":"A student starts an intervention at 42% accuracy and reaches 44%, 43%, 45%, 44%, and 46% over five checks while the goal is 70%. Which interpretation is strongest?","options":["Growth is minimal and the intervention should be reviewed","Continue the intervention unchanged because the scores show an upward trend","Increase intensity immediately because the current score remains below the goal","Extend monitoring before making any change because five checks may not establish a stable pattern"],"answer":"Growth is minimal and the intervention should be reviewed","why":"The repeated data show little movement toward the goal. The team should review the intervention and relevant implementation evidence rather than treat the pattern as automatic eligibility.","difficulty":5,"format":"transfer","distractorCoach":"A small increase can sound positive, but adequate response requires meaningful progress toward the target.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Judge the trend against the goal, not whether the final score is slightly higher than baseline."},{"id":"v412_pm_3","topicId":"progress_monitoring","section":"assessments","prompt":"Which situation would make progress-monitoring results difficult to interpret even though data were collected weekly?","options":["Administration procedures changed from week to week","The data were graphed","A goal line was included","The measure produced numerical scores"],"answer":"Administration procedures changed from week to week","why":"Changing administration procedures can introduce inconsistency, making score changes harder to attribute to student progress.","difficulty":4,"format":"error_analysis","distractorCoach":"Frequency of measurement does not compensate for unreliable administration.","qualityReviewed":true,"keyClue":"Repeated data are only useful when measurement conditions are sufficiently consistent."},{"id":"v412_pm_4","topicId":"progress_monitoring","section":"assessments","prompt":"A team has six weeks of stable progress-monitoring data showing improvement that closely approaches the goal. What is the most defensible next step?","options":["Continue the effective support while monitoring progress","Reduce the support because the student is approaching the goal","Increase intervention intensity so the student reaches the goal faster","Move to less frequent monitoring because the data are stable"],"answer":"Continue the effective support while monitoring progress","why":"When data show an adequate response, continuing the successful intervention while monitoring is more defensible than treating referral as automatic.","difficulty":5,"format":"transfer","distractorCoach":"Referral is not the goal of MTSS; the goal is effective support based on data.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Progress monitoring informs decisions in both directions: lack of response may prompt review, while adequate response supports continuation."},{"id":"v412_pm_5","topicId":"progress_monitoring","section":"assessments","prompt":"Why is a baseline score useful but insufficient by itself for evaluating an intervention?","options":["It establishes a starting point but does not show a trend","It shows initial severity but does not indicate how the student responds to intervention","It can be compared with a benchmark but does not show implementation fidelity","It describes current performance but does not establish whether later change is instructionally meaningful"],"answer":"It establishes a starting point but does not show a trend","why":"Baseline provides the point of comparison. Repeated measures after intervention are needed to determine whether performance changes over time.","difficulty":2,"format":"scenario","distractorCoach":"Do not confuse having a starting score with actually monitoring change.","qualityReviewed":true,"keyClue":"Baseline = starting point; progress monitoring = repeated evidence after that point."},{"id":"v412_pre_mix1","topicId":"prereferral_mixed","section":"prereferral","prompt":"A team has documented a reading concern and reviewed existing data. What should happen before the intervention is implemented?","options":["The team should meet and develop a specific plan","The team should collect additional data before discussing an intervention plan","The intervention should begin immediately and the formal plan can be written after the first progress check","The student should be referred for a comprehensive evaluation before the team selects a targeted intervention"],"answer":"The team should meet and develop a specific plan","why":"After information gathering, stakeholders discuss the evidence and develop the intervention plan before implementation.","difficulty":3,"format":"discrimination","distractorCoach":"Several choices may describe legitimate school actions; choose the one that fits the current step and evidence.","qualityReviewed":true,"keyClue":"Identify where the team is in the process and what evidence the decision requires."},{"id":"v412_pre_mix2","topicId":"prereferral_mixed","section":"prereferral","prompt":"A student receives targeted intervention with fidelity, but progress-monitoring data remain flat across six weeks. Which action best reflects data-based pre-referral decision-making?","options":["Review effectiveness and consider adjustment or referral based on the full evidence","Increase intervention intensity while continuing the same progress-monitoring schedule","Collect additional diagnostic data before making any change to the intervention","Extend the intervention cycle to establish a longer trend before considering another action"],"answer":"Review effectiveness and consider adjustment or referral based on the full evidence","why":"Evaluation and review use response data to determine whether support should continue, change, or lead toward referral.","difficulty":5,"format":"transfer","distractorCoach":"Several choices may describe legitimate school actions; choose the one that fits the current step and evidence.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Identify where the team is in the process and what evidence the decision requires."},{"id":"v412_pre_mix3","topicId":"prereferral_mixed","section":"prereferral","prompt":"Which evidence set gives an IAT the strongest basis for deciding whether additional data are needed?","options":["Recent assessments, observations, intervention data, and stakeholder information tied to the concern","Only the most recent test score","Only teacher opinion","Scores from unrelated subjects"],"answer":"Recent assessments, observations, intervention data, and stakeholder information tied to the concern","why":"The team should examine the scope and depth of relevant existing data before deciding what gaps remain.","difficulty":4,"format":"error_analysis","distractorCoach":"Several choices may describe legitimate school actions; choose the one that fits the current step and evidence.","qualityReviewed":true,"keyClue":"Identify where the team is in the process and what evidence the decision requires."},{"id":"v412_pre_mix4","topicId":"prereferral_mixed","section":"prereferral","prompt":"An intervention plan exists, but the teacher has not yet started it. Which statement is accurate?","options":["The team is still in plan development, not implementation","The team is already in evaluation and review","The team has completed referral","The team is in initial concern"],"answer":"The team is still in plan development, not implementation","why":"Implementation begins when the agreed intervention is actually delivered.","difficulty":2,"format":"scenario","distractorCoach":"Several choices may describe legitimate school actions; choose the one that fits the current step and evidence.","qualityReviewed":true,"keyClue":"Identify where the team is in the process and what evidence the decision requires."},{"id":"v412_pre_mix5","topicId":"prereferral_mixed","section":"prereferral","prompt":"A team sees a large gap between expected and actual performance and also has weekly data showing little response to intervention. Which statement is strongest?","options":["Both discrepancy and RTI information may be relevant to the decision","Only discrepancy can be considered","Only RTI can be considered","The two forms of evidence contradict each other by definition"],"answer":"Both discrepancy and RTI information may be relevant to the decision","why":"A performance gap and response-to-intervention data answer different questions and can both inform a comprehensive decision.","difficulty":5,"format":"transfer","distractorCoach":"Several choices may describe legitimate school actions; choose the one that fits the current step and evidence.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Identify where the team is in the process and what evidence the decision requires."},{"id":"v412_qual_mix1","topicId":"quality_mixed","section":"quality","prompt":"A behavior measure produces stable ratings across three administrations, but its items do not address the anxiety concern named in the referral. Which combination is most accurate?","options":["Reliability appears stronger than validity/relevance","Validity is strong because scores are stable","Bias is proven","Duration is the only concern"],"answer":"Reliability appears stronger than validity/relevance","why":"Stable scores support reliability, but poor alignment with the intended concern raises validity and/or relevance concerns.","difficulty":5,"format":"transfer","distractorCoach":"The trap is choosing a quality term that is true in general but not the main problem in this scenario.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-ba ciding which issue is primary."},{"id":"v412_law_mix1","topicId":"law_mixed","section":"law","prompt":"A parent requests access to the student's education records during a referral process. Which law most directly governs that request?","options":["FERPA","ADA","Rowley","PBIS"],"answer":"FERPA","why":"FERPA protects education-record privacy and gives parents eligible rights to inspect records.","difficulty":2,"format":"scenario","distractorCoach":"A complex stem may mention several laws; choose the one tied to the exact right or next action being asked about.","qualityReviewed":true,"keyClue":"Separate privacy, access, educational benefit, and referral/evaluation responsibilities."},{"id":"v412_law_mix2","topicId":"law_mixed","section":"law","prompt":"A student with a disability cannot access required graphical information because no accessible alternative is provided. Which principle is most directly implicated?","options":["ADA equal access/non-discrimination","FERPA record privacy","Rowley educational benefit only","Criterion-referenced testing"],"answer":"ADA equal access/non-discrimination","why":"The barrier concerns equal access to the assessment, not confidentiality of records.","difficulty":3,"format":"discrimination","distractorCoach":"A complex stem may mention several laws; choose the one tied to the exact right or next action being asked about.","qualityReviewed":true,"keyClue":"Separate privacy, access, educational benefit, and referral/evaluation responsibilities."},{"id":"v412_law_mix3","topicId":"law_mixed","section":"law","prompt":"A colleague says Rowley requires schools to maximize every student's potential. What is the strongest correction?","options":["Rowley is associated with individualized educational benefit, not a maximize-potential standard","Rowley is a records-privacy case","Rowley created PBIS","Rowley requires only standardized tests"],"answer":"Rowley is associated with individualized educational benefit, not a maximize-potential standard","why":"The decision rejected a requirement to maximize potential and focused on appropriate educational benefit under the individualized program.","difficulty":4,"format":"error_analysis","distractorCoach":"A complex stem may mention several laws; choose the one tied to the exact right or next action being asked about.","qualityReviewed":true,"keyClue":"Separate privacy, access, educational benefit, and referral/evaluation responsibilities."},{"id":"v412_law_mix4","topicId":"law_mixed","section":"law","prompt":"A scenario mentions confidential records, disability access, and lack of progress. What should you do before selecting FERPA, ADA, or a referral principle?","options":["Identify the specific legal or decision issue the question asks about","Choose ADA whenever disability is mentioned","Choose FERPA whenever school records exist","Choose referral whenever progress is low"],"answer":"Identify the specific legal or decision issue the question asks about","why":"Complex stems may contain several true facts. The task word and requested issue determine which principle controls.","difficulty":5,"format":"transfer","distractorCoach":"A complex stem may mention several laws; choose the one tied to the exact right or next action being asked about.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Separate privacy, access, educational benefit, and referral/evaluation responsibilities."},{"id":"v412_law_mix5","topicId":"law_mixed","section":"law","prompt":"A student shows persistent lack of progress despite appropriate intervention, and the school psychologist identifies a suspected IDEA disability. Which next action is best supported?","options":["Make a formal referral for special education evaluation","Wait indefinitely for another report card","Write an IEP without evaluation","Use FERPA to determine eligibility"],"answer":"Make a formal referral for special education evaluation","why":"Documented need plus suspected disability supports formal evaluation; eligibility and an IEP come after the appropriate evaluation process.","difficulty":5,"format":"transfer","distractorCoach":"A complex stem may mention several laws; choose the one tied to the exact right or next action being asked about.","qualityReviewed":true,"level5Reviewed":true,"transferReason":"Requires applying the concept in a novel, mixed, or decision-based context rather than recalling a definition.","keyClue":"Separate privacy, access, educational benefit, and referral/evaluation responsibilities."}],"misconceptionCatalog":[{"id":"reliability_vs_validity","label":"Reliability ↔ Validity","topics":["reliability","validity_relevance"],"repair":"Consistency does not prove the intended construct is measured."},{"id":"norm_vs_criterion","label":"Norm ↔ Criterion","topics":["norm_criterion"],"repair":"Norm = peers; criterion = a defined standard or skill."},{"id":"formative_vs_informal","label":"Formative ↔ Informal","topics":["formative_summative","assessment_methods"],"repair":"Formative describes purpose; informal describes structure/method."},{"id":"rti_vs_discrepancy","label":"RTI ↔ Discrepancy","topics":["mtss_components"],"repair":"RTI asks about response to intervention; discrepancy asks about the performance gap."},{"id":"bias_vs_access","label":"Bias ↔ Access","topics":["bias_access"],"repair":"Identify whether irrelevant background knowledge or inaccessible presentation creates the barrier."},{"id":"ferpa_vs_ada","label":"FERPA ↔ ADA","topics":["laws","law_mixed"],"repair":"FERPA = education-record privacy; ADA = disability access/non-discrimination."}],"preassessmentProfile":{"attemptStatus":"Not Passed","totalItems":45,"correct":30,"missed":15,"priorityConcepts":["records_checklists","norm_criterion","formative_summative","mtss_components","rti_pbis_tools","reliability","validity_relevance","bias_access","laws","rowley_referral"]},"studySections":[{"id":"assessment_methods","title":"Assessment Methods","icon":"🔭","concepts":["assessment_methods","records_checklists"],"summary":"Know what each assessment method actually does. Questions often gives you a classroom action and asks you to name the method.","rows":[["Observation","Document behavior or performance in context","WATCH what happens"],["Interview","Gather information directly from student, caregiver, or teacher","ASK"],["Portfolio","Collection of student work across time","COLLECTION"],["Anecdotal record","Dated narrative note about an incident or behavior","STORY / NOTE"],["Scaled checklist","Rate frequency, intensity, or degree using a set scale","SCALE = RATE"]],"trap":"A narrative note is an anecdotal record. A predetermined frequency/intensity rating is a scaled checklist."},{"id":"purpose_data","title":"Assessment Purpose & Data","icon":"🌙","concepts":["formative_summative","quant_qual","progress_monitoring"],"summary":"Separate the purpose of an assessment from its format, and distinguish numerical from descriptive evidence.","rows":[["Formative","Ongoing feedback DURING learning used to adjust instruction","FOR learning"],["Summative","End-of-unit/high-stakes/final evaluation","SUMS up"],["Quantitative","Numerical scores, frequency, percentages, cut scores","QUANTITY = numbers"],["Qualitative","Descriptions, interviews, observations, narratives","QUALITY = description"],["Progress monitoring","Frequent repeated measurement to evaluate response/growth","REPEAT data"]],"trap":"Informal describes structure. Formative describes PURPOSE. Questions may place both in the same answer set."},{"id":"norm_criterion","title":"Norm vs. Criterion","icon":"⚖️","concepts":["norm_criterion"],"summary":"Identify what the student's performance is being compared against.","rows":[["Norm-referenced","Performance compared with a peer/norm group","NORM = people"],["Criterion-referenced","Performance compared with a defined standard, skill, or criterion","CRITERIA = standard"]],"trap":"Words such as national sample, percentile, or peers point to norm. Mastery, standard, benchmark, or defined performance level point to criterion."},{"id":"prereferral","title":"Six Pre-Referral Steps","icon":"🪄","concepts":["prereferral_steps","prereferral_mixed","additional_data"],"summary":"Assessment scenarios often ask what happens NEXT. Memorize the sequence, then use the scenario clue rather than guessing.","rows":[["1. Initial concern","Problem is recognized, documented, and shared","NOTICE"],["2. Information gathering","Collect and review existing data","GATHER"],["3. Team meeting","Stakeholders discuss needs and performance","TALK"],["4. Plan development","Choose strategies/interventions and define the plan","PLAN"],["5. Implementation","Carry out the intervention","DO"],["6. Evaluation & review","Review effectiveness and adjust as needed","REVIEW"]],"trap":"Do not jump to implementation before the team has gathered information and developed a plan."},{"id":"mtss","title":"MTSS, RTI, SEL & PBIS","icon":"🌟","concepts":["mtss_components","additional_data"],"summary":"Know the role of each framework/tool and what kind of problem it is designed to address.","rows":[["MTSS","Broad multi-tiered system combining academic, behavioral, and other supports","UMBRELLA"],["RTI","Student response to evidence-based intervention","RESPONSE"],["SEL","Self-awareness, relationships, responsible decision-making","SELF / SOCIAL"],["PBIS","Positive behavior support framework using prevention and data","BEHAVIOR SUPPORT"],["Discrepancy approach","Gap between expected and actual performance","GAP"],["Universal screening","Brief assessment to identify students at risk","FIND RISK"],["Additional data","Review existing evidence, identify gaps, then collect what is missing","FILL GAPS"]],"trap":"RTI asks how the learner responds to intervention. Discrepancy focuses on the performance gap."},{"id":"quality","title":"Reliability, Validity, Relevance, Bias & Duration","icon":"💎","concepts":["reliability","validity_relevance","quality_mixed","bias_access"],"summary":"This is a high-yield discrimination set. Several answers can sound reasonable; identify the exact problem in the evidence.","rows":[["Reliability","Are results consistent or repeatable?","CONSISTENCY"],["Validity","Does the measure assess the intended construct?","RIGHT THING"],["Relevance","Does this evidence actually address THIS concern or decision?","FITS THIS QUESTION"],["Bias","Is an irrelevant factor unfairly influencing performance?","UNFAIR INFLUENCE"],["Duration","Was evidence collected across enough/appropriate time?","TIME / SPAN"]],"trap":"Consistent results can still be invalid or irrelevant. First identify what the stem says is wrong: consistency, construct, fit, fairness, or time."},{"id":"law","title":"Law, Referral & Rowley","icon":"👑","concepts":["laws","law_mixed","rowley_referral"],"summary":"Use the legal clue in the stem. Questions may combine privacy, access, referral, evaluation, and educational benefit in one answer set.","rows":[["FERPA","Protects education-record privacy and access rights","FILES / RECORDS"],["ADA","Equal access and nondiscrimination for individuals with disabilities","ACCESS"],["IDEA referral","Suspected disability affecting learning/participation should lead to appropriate evaluation","SUSPECT → EVALUATE"],["Referral indicator","Documented lack of progress despite targeted interventions can support referral/evaluation","TARGETED + LITTLE PROGRESS"],["Rowley (1982)","FAPE and an individualized program reasonably designed to provide educational benefit","EDUCATIONAL BENEFIT"]],"trap":"Do not delay an appropriate evaluation indefinitely just to keep trying interventions. Rowley is broader than one behavior strategy."},{"id":"test_strategy","title":"Multiple-Choice Strategy","icon":"🪽","concepts":[],"summary":"Your job is not to prove every option is false. Your job is to choose the option that function v338ShouldUseBundledProgress(current){
  try{
    const applied=localStorage.getItem('majick_v338_progress_seed_applied');
    if(applied===V338_PROGRESS_SEED_ID)return false;
    if(!current)return true;
    const cp=current?.progress?.PMFC||{},sp=V338_BUNDLED_PROGRESS?.progress?.PMFC||{};

    const cx=Number(cp.xp||0), sx=Number(sp.xp||0);
    const ct=Number(current?.v52?.lastSaveAt||0), st=Number(V338_BUNDLED_PROGRESS?.v52?.lastSaveAt||0);
    // Never roll back obvious newer progress.
    if(ca>sa || cx>sx || (ct>st && ca>=sa))return false;

  }catch(_e){return !current}
}

function analyticsHTML(){const st=stats(), c=course();let rows=c.concepts.map(k=>{const a=(st.per[k.id]||[]).slice(-8);let acc=a.length?a.filter(x=>x.correct).length/a.length:null;return {t:k.title,id:k.id,n:a.length,acc}}).sort((a,b)=>(a.acc??-1)-(b.acc??-1));return `<div class="sectionTitle"><div><h2>Thinking Analytics</h2><p>Tracks study performance, not intelligence. Use it to decide what to practice next.</p></div></div><div class="grid"><div class="card c4"><h3>Readiness</h3><div class="num">${st.readiness}%</div><div class="progress"><i style="width:${st.readiness}%"></i></div></div><div class="card c4"><h3>Coverage</h3><div class="num">${st.touched.size}/${c.concepts.length}</div><p>Concepts practiced</p></div><div class="card c4"><h3>High-confidence errors</h3><div class="num">${st.a.filter(x=>!x.correct&&x.confidence==='certain').length}</div><p>These deserve immediate repair.</p></div><div class="card c12"><h3>Concept mastery</h3><table class="table"><thead><tr><th>Concept</th><th>Recent items</th><th>Accuracy</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.t)}</td><td>${r.n}</td><td class="${r.acc!=null&&r.acc>=.75?'strong':'weak'}">${r.acc==null?'Not practiced':pct(r.acc)+'%'}</td><td><button class="btn ghost" onclick="practiceTopics(['${r.id}'])">Practice</button></td></tr>`).join('')}</tbody></table></div></div>`}
