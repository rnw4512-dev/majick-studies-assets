function switchCourse(id){if(S.courses[id]){S.activeCourse=id;session=null;S.screen='home';save();render()}}
function resetUI(){session=null;S.screen='home';save();render()}
function questionPool(opts={}){let q=[...(course().questionBank||[])];q=q.filter(x=>!/^reason_|^disc_/.test(x.id||''));if(opts.topics?.length)q=q.filter(x=>opts.topics.includes(x.topicId));if(opts.hard)q=q.filter(x=>(x.difficulty||1)>=4);return q}
function topicTargetDifficulty(topicId){const a=prog().answers.filter(x=>x.topicId===topicId).slice(-7);if(!a.length)return 2;let streak=0;for(let i=a.length-1;i>=0&&a[i].correct;i--)streak++;let acc=a.filter(x=>x.correct).length/a.length;if(streak>=4&&acc>=.82)return 5;if(streak>=2&&acc>=.75)return 4;if(acc>=.68)return 3;if(acc<.5)return 2;return 3}
function weakestTopic(){const st=stats(),cs=course().concepts;let best=null,bscore=99;for(const c of cs){const a=(st.per[c.id]||[]).slice(-6);let sc=a.length?a.filter(x=>x.correct).length/a.length:.5-(course().preassessmentProfile?.priorityConcepts||[]).includes(c.id)*.15;if(sc<bscore){bscore=sc;best=c.id}}return best||cs[0]?.id}
function pickAdaptive(pool=questionPool()){const p=prog(),count=p.answers.length;const due=(p.repair||[]).filter(r=>r.due<=count);if(due.length){const t=due[0].topicId;const cand=pool.filter(q=>q.topicId===t&&!p.answers.slice(-5).some(a=>a.qid===q.id));if(cand.length){p.repair=p.repair.filter(x=>x!==due[0]);save();return rand(cand)}}const st=stats();let scored=pool.map(q=>{let a=st.per[q.topicId]||[],ac=a.length?a.filter(x=>x.correct).length/a.length:.55;let unseen=p.answers.some(x=>x.qid===q.id)?0:2.3;let target=topicTargetDifficulty(q.topicId);let closeness=2.4-Math.min(2.4,Math.abs((q.difficulty||1)-target)*.65);let recent=p.answers.slice(-9).some(x=>x.qid===q.id)?-5:0;let challenge=(st.acc>.74&&q.difficulty>=4)?1.1:0;return [q,(1-ac)*3.8+unseen+closeness+challenge+recent+Math.random()*.8]});scored.sort((a,b)=>b[1]-a[1]);return scored[0]?.[0]||rand(pool)}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function startSession(type,opts={}){clearTimer();session={type,opts,index:0,score:0,combo:0,lives:opts.lives||3,questions:[],current:null,answered:false,confidence:'sure',highlight:[],review:[],bossHP:100,playerHP:5,start:Date.now(),aiQueue:[],reward:null};S.screen='mission';nextQuestion();render()}
function startAdaptive(){startSession('adaptive',{label:'Smart Mission',limit:12})}function startReason(){startSession('reason',{label:'Reason Ready',limit:10})}function startMixed(){startSession('mixed',{label:'Mixed OA',limit:15})}function startClueHunter(){startSession('clue',{label:'Clue Hunter',limit:10})}function practiceTopics(t){startSession('topic',{label:'Topic Practice',topics:t,limit:12})}
function startRush(){startSession('rush',{label:'Streak Rush',limit:99,lives:3,seconds:60});let left=60;session.seconds=left;timerHandle=setInterval(()=>{if(!session||session.type!=='rush'){clearTimer();return}session.seconds=--left;const el=document.getElementById('timer');if(el)el.textContent=left+'s';if(left<=0){clearTimer();finishSession()}},1000)}
function startWeakPair(){const cat=course().misconceptionCatalog||[];let pair=cat[0];const a=prog().answers.filter(x=>!x.correct).slice(-30);let score=cat.map(m=>[m,m.topics.reduce((n,t)=>n+a.filter(x=>x.topicId===t).length,0)]).sort((x,y)=>y[1]-x[1]);if(score[0]&&score[0][1])pair=score[0][0];startSession('weakpair',{label:'Weak-Pair Battle: '+(pair?.label||'Close Concepts'),topics:pair?.topics||[],limit:12,repair:pair?.repair||''})}
function startBoss(){let t=weakestTopic(),title=course().concepts.find(c=>c.id===t)?.title||t;startSession('boss',{label:'Boss Battle: '+title,topics:[t],limit:30})}
function startAutopsy(){let last=[...(prog().answers||[])].reverse().find(a=>!a.correct&&a.topicId);startSession('autopsy',{label:'Distractor Autopsy',topics:last?[last.topicId]:undefined,limit:10})}function startWhyNot(){startSession('whynot',{label:'Why Not?',limit:10})}
function startFill(){startSession('fill',{label:'Fill Forge',limit:12})}
function nextQuestion(){if(!session)return;let pool=questionPool({topics:session.opts.topics,hard:session.opts.hard});if(session.type==='fill'){return nextFill()}if(session.type==='moonword'||session.type==='match')return;let q=(session.aiQueue&&session.aiQueue.length)?session.aiQueue.shift():pickAdaptive(pool);session.current=q;session.answered=false;session.highlight=[];session.confidence='sure';session.whyWrong=null;session.whyReasons=null;session.whyAnswered=false;session.reward=null;session.index++;if(session.opts.limit&&session.index>session.opts.limit){finishSession();return}}
function startTest(n,hard=false){let pool=questionPool({hard});shuffle(pool);let arr=pool.slice(0,Math.min(n,pool.length));session={type:'test',opts:{label:n+'-Question OA Simulation',limit:arr.length},index:1,score:0,questions:arr,current:arr[0],answered:false,confidence:'sure',review:[],start:Date.now()};S.screen='mission';render()}
function startMatch(){session={type:'match',opts:{label:'Match Constellations'},pairs:[],selected:null,done:0};let entries=Object.entries(course().glossary||{});shuffle(entries);session.pairs=entries.slice(0,8).map(([term,def],i)=>({i,term,def}));S.screen='mission';render()}
function startMoonword(){session={type:'moonword',opts:{label:'Moonword Camp'},items:[]};let e=Object.entries(course().glossary||{});shuffle(e);session.items=e.slice(0,8).map(([term,def],i)=>({term,def,choice:null,ok:null}));S.screen='mission';render()}
function nextFill(){let e=Object.entries(course().glossary||{});let [term,def]=rand(e);let other=e.filter(x=>x[0]!==term);shuffle(other);let opts=[term,...other.slice(0,3).map(x=>x[0])];shuffle(opts);session.current={id:'fill_'+term+'_'+session.index,topicId:'',section:'',prompt:`Complete the concept: “${def}”`,options:opts,answer:term,why:`The correct course term is ${term}.`,difficulty:2,format:'fill',keyClue:def,distractorCoach:'Match the definition to the exact course term.'};session.answered=false;session.index++;if(session.opts.limit&&session.index>session.opts.limit){finishSession()}}
function sessionHTML(){if(!session)return '';if(session.type==='match')return matchHTML();if(session.type==='moonword')return moonwordHTML();if(session.finished)return resultHTML();let q=session.current;if(!q)return `<div class="empty">No questions available for this mode.</div>`;let clue=session.type==='clue';return `<div class="qwrap"><div class="qtop"><div><span class="qbadge">${esc(session.opts.label||session.type)}</span> <span class="qbadge">${session.index}${session.opts.limit?'/'+session.opts.limit:''}</span></div><div>${session.type==='rush'?`<span id="timer" class="timer">${session.seconds??60}s</span> • `:''}${session.type==='boss'?`<span class="hearts">${'💗'.repeat(Math.max(0,session.playerHP))}</span>`:`<span>Score ${session.score}</span> <span class="comboGlow">✦ x${Math.max(1,session.combo||0)}</span>`}</div></div><div class="rewardStrip" style="margin:0 0 12px"><span class="rewardChip">✨ ${prog().xp||0} XP</span><span class="rewardChip">💎 ${prog().crystals||0} crystals</span>${session.aiQueue?.length?'<span class="aiBadge">✦ Moon Oracle challenge ready</span>':''}</div>${session.type==='boss'?`<div class="card" style="margin-bottom:14px"><b>👑 Boss HP</b><div class="bossBar"><i style="width:${Math.max(0,session.bossHP)}%"></i></div></div>`:''}<div class="card"><div class="tiny">${esc(q.section||'Mixed')} • Difficulty ${q.difficulty||1} • ${esc(q.format||'multiple choice')}</div><div class="question">${esc(q.prompt)}</div>${clue&&!session.answered?clueHTML(q.prompt):''}<div class="confidence"><span class="tiny" style="padding-top:8px">Confidence:</span>${[['guess','🎲 Guess'],['50','🤔 50/50'],['sure','👍 Sure'],['certain','🔥 Certain']].map(x=>`<button class="${session.confidence===x[0]?'sel':''}" onclick="setConfidence('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="options">${q.options.map(o=>`<button class="opt ${session.answered?(o===q.answer?'correct':(o===session.chosen?'wrong':'')):''}" ${session.answered?'disabled':''} onclick='answerQ(${JSON.stringify(o)})'>${esc(o)}</button>`).join('')}</div>${session.answered?feedbackHTML(q):''}</div></div>`}
function clueHTML(text){let toks=text.split(/(\s+)/);return `<div class="tiny"><b>Step 1:</b> Click the clue words or phrases that matter. You are not graded on highlighting.</div><div class="clueWords">${toks.map((w,i)=>/^\s+$/.test(w)?w:`<span class="word ${session.highlight.includes(i)?'on':''}" onclick="toggleClue(${i})">${esc(w)}</span>`).join('')}</div><div class="tiny"><b>Step 2:</b> Choose the best answer.</div>`}
function toggleClue(i){let a=session.highlight,ix=a.indexOf(i);ix>=0?a.splice(ix,1):a.push(i);render()}
function setConfidence(x){session.confidence=x;render()}
function answerQ(chosen){if(!session||session.answered)return;let q=session.current,correct=chosen===q.answer;session.chosen=chosen;session.answered=true;session.score+=correct?1:0;session.combo=correct?session.combo+1:0;if(session.type==='rush'&&!correct)session.lives--;if(session.type==='boss'){session.bossHP-=correct?Math.min(18,8+(q.difficulty||1)*2):0;if(!correct)session.playerHP--}record(q,chosen,correct,session.confidence,session.type);if(correct){grantMoonlight(q);sparkle(true);playChime(true);if(session.combo>0&&session.combo%5===0)transformationBurst();if(session.combo>=3&&(q.difficulty||1)>=3)requestAIChallenge(q)}else{playChime(false)}if(session.type==='test'){session.review.push({q,chosen,correct});setTimeout(()=>{if(session.index>=session.questions.length){finishSession()}else{session.current=session.questions[session.index++];session.answered=false;render()}},100);return}render()}
function grantMoonlight(q){let p=prog();let base=8+(q.difficulty||1)*3,bonus=Math.min(15,Math.max(0,(session.combo||1)-1)*2),xp=base+bonus,cr=(q.difficulty||1)>=4?2:1;p.xp=(p.xp||0)+xp;p.crystals=(p.crystals||0)+cr;session.reward={xp,cr};let milestones=[[25,'Crescent Charm'],[75,'Starlight Charm'],[150,'Crystal Heart'],[300,'Moon Crown']];p.charms=p.charms||[];for(const [n,name] of milestones)if(p.xp>=n&&!p.charms.includes(name))p.charms.push(name);save();rewardToast(`+${xp} XP  ✦  +${cr} 💎`,session.combo>=5?`Transformation streak x${session.combo}!`:`Correct answer • difficulty ${q.difficulty||1}`)}
function rewardToast(big,mini){let t=document.createElement('div');t.className='rewardToast';t.innerHTML=`<div class="big">${esc(big)}</div><div class="mini">${esc(mini)}</div>`;document.body.appendChild(t);setTimeout(()=>t.remove(),1450)}
function transformationBurst(){let d=document.createElement('div');d.className='transformation';d.innerHTML='<div class="sigil">☾✦</div>';document.body.appendChild(d);setTimeout(()=>d.remove(),1150);glitterBurst(38)}
function glitterBurst(n=24){let box=document.createElement('div');box.className='glitterBurst';let icons=['✦','✧','☆','♡','◇','☾'];for(let i=0;i<n;i++){let b=document.createElement('span');b.className='glitterBit';b.textContent=icons[Math.floor(Math.random()*icons.length)];b.style.left=(45+Math.random()*10)+'vw';b.style.top=(42+Math.random()*12)+'vh';b.style.color=['#f4c95d','#ee8fbd','#9b7ae0','#8fd8d1','#a8d9ff'][i%5];b.style.setProperty('--dx',((Math.random()-.5)*520)+'px');b.style.setProperty('--dy',((Math.random()-.42)*420)+'px');box.appendChild(b)}document.body.appendChild(box);setTimeout(()=>box.remove(),1350)}
function playChime(ok){try{if(S.sound===false)return;let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=ok?659:220;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.07,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.22);o.start();o.stop(c.currentTime+.23)}catch(_){}}
async function requestAIChallenge(q){if(session.aiRequestPending||session.aiQueue?.length)return;session.aiRequestPending=true;try{let topic=course().concepts.find(c=>c.id===q.topicId)?.title||q.topicId;let related=questionPool({topics:[q.topicId]}).slice(0,6).map(x=>({prompt:x.prompt,options:x.options,answer:x.answer,why:x.why,difficulty:x.difficulty}));let body={courseId:course().id,courseTitle:course().title,topic,topicId:q.topicId,targetDifficulty:Math.min(5,(q.difficulty||3)+1),glossary:course().glossary,related};let ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),4500);let r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctrl.signal});clearTimeout(tm);if(!r.ok)throw Error('AI unavailable');let nq=await r.json();if(nq&&Array.isArray(nq.options)&&nq.options.length===4&&nq.answer){nq.id=nq.id||'ai_'+Date.now();nq.topicId=q.topicId;nq.section=q.section;nq.difficulty=Math.max(4,nq.difficulty||4);nq.format='ai_challenge';nq.aiGenerated=true;session.aiQueue=session.aiQueue||[];session.aiQueue.push(nq)}}catch(_){/* Offline mode stays fully functional */}finally{session.aiRequestPending=false}}

<script id="v4Layer">
/* ===== Moonlit Mastery V4 • Companion Realms ===== */
const V4_VERSION='4.0 Companion Realms';
const V4_PETS={
 luna:{species:'Moon Cat',emoji:'🐈‍⬛',ability:'clue',abilityName:'Moonbeam Clue',tip:'reveals the controlling clue'},

 aurelia:{species:'Crystal Owl',emoji:'🦉',ability:'lens',abilityName:'Crystal Lens',tip:'gives a best-answer comparison lens'},
 mallow:{species:'Winged Bunny',emoji:'🐇',ability:'shield',abilityName:'Ribbon Shield',tip:'protects one combo streak'},
 lyra:{species:'Celestial Fawn',emoji:'🦌',ability:'boost',abilityName:'Heartlight Boost',tip:'boosts the reward on a hard question'},
 ember:{species:'Pocket Dragon',emoji:'🐉',ability:'boss',abilityName:'Guardian Flame',tip:'restores one heart in a boss battle'}
};
const V4_REALMS={
 moonPalace:{name:'Moon Palace Atrium',icon:'🌙',cost:0,desc:'Pearl light, gold moons, and soft celestial shimmer.'},
 pearlCloud:{name:'Pearl Cloud Kingdom',icon:'☁️',cost:28,desc:'Dreamy clouds, blush light, and floating pearl tones.'},
 celestialLibrary:{name:'Celestial Library',icon:'📚',cost:32,desc:'Golden study lamps and enchanted library calm.'},
 roseNebula:{name:'Rose Nebula Garden',icon:'🌹',cost:38,desc:'Pink nebula roses, lavender starlight, and ribbon glow.'},
 starlightRooftop:{name:'Starlight Rooftop',icon:'🌆',cost:42,desc:'A glittering city-sky study realm at moonrise.'},
 dreamTemple:{name:'Dream Temple',icon:'⛩️',cost:46,desc:'Mint crystal light, moon pools, and quiet magical focus.'},
 midnightObservatory:{name:'Midnight Observatory',icon:'🔭',cost:52,desc:'Deep violet skies for serious focus sessions.'}
};
const V4_ACCESSORIES=['🎀 Moon Bow','👑 Crystal Tiara','💗 Heart Collar','✨ Star Cape','🌙 Crescent Charm','🪽 Tiny Wings','🔮 Oracle Bell'];
const V4_ROOM_SHOP=[{id:'moonPillow',emoji:'🌙',name:'Moon Pillow',cost:10},{id:'crystalLamp',emoji:'💎',name:'Crystal Lamp',cost:14},{id:'roseVase',emoji:'🌹',name:'Rose Nebula Vase',cost:12},{id:'starBooks',emoji:'📚',name:'Starspell Books',cost:15},{id:'pearlBed',emoji:'🛏️',name:'Pearl Cloud Bed',cost:20},{id:'ribbonMirror',emoji:'🪞',name:'Ribbon Mirror',cost:18}];
function ensureV4(){
 S.version=V4_VERSION;S.legacy=S.legacy||{};
 let L=S.legacy;
 if(!L.initialized){let vals=Object.values(S.progress||{});let current=prog();L.xp=Math.max(current?.xp||0,...vals.map(p=>p.xp||0));L.crystals=Math.max(current?.crystals||0,...vals.map(p=>p.crystals||0));L.initialized=true}
 L.pets=L.pets||[{id:'luna',type:'luna',name:(prog().companion?.name||'Luna'),bond:(prog().companion?.bond||0),hatched:true,hatchedAt:Date.now()-1,accessory:prog().companion?.accessory||'🎀 Moon Bow'}];
 L.activePetId=L.activePetId||L.pets[0]?.id||'luna';L.eggs=L.eggs||[];L.realms=L.realms||['moonPalace'];L.activeRealm=L.activeRealm||'moonPalace';L.accessories=L.accessories||['🎀 Moon Bow'];L.roomItems=L.roomItems||['🛏️','🌙','📚'];L.roomUnlocked=L.roomUnlocked||[];L.trophies=L.trophies||[];L.lastChestReward=L.lastChestReward||null;
 if(L.eggs.length===0&&L.pets.length<2){L.eggs.push(makeEgg('starter'))}
 for(const id of Object.keys(S.progress||{})){let p=S.progress[id];p.questionMemory=p.questionMemory||[];p.bestCombo=p.bestCombo||0;p.sessionHistory=p.sessionHistory||[];p.dailyClaimed=p.dailyClaimed||'';p.weeklyClaimed=p.weeklyClaimed||'';p.aiGeneratedCount=p.aiGeneratedCount||0;p.petAbilityUses=p.petAbilityUses||0;p.masteryRewarded=p.masteryRewarded||[];p.explanations=p.explanations||[]}
 if(prog()){prog().xp=L.xp||prog().xp||0;prog().crystals=L.crystals??prog().crystals??0}
}
function makeEgg(source='chest'){let types=['nova','aurelia','mallow','lyra','ember'];let owned=new Set((S.legacy?.pets||[]).map(p=>p.type));let pool=types.filter(t=>!owned.has(t));if(!pool.length)pool=types;let type=rand(pool);return {id:'egg_'+Date.now()+'_'+Math.floor(Math.random()*9999),type,progress:0,goal:18+Math.floor(Math.random()*8),source,createdAt:Date.now()}}
function petStage(p){let b=p?.bond||0;return b>=180?'Celestial':b>=60?'Guardian':'Baby'}
function activePet(){let L=S.legacy||{};return (L.pets||[]).find(p=>p.id===L.activePetId)||(L.pets||[])[0]||{id:'luna',type:'luna',name:'Luna',bond:0}}
function petDef(p=activePet()){return V4_PETS[p.type]||V4_PETS.luna}
function legacySync(){let L=S.legacy;if(!L||!prog())return;L.xp=prog().xp||0;L.crystals=prog().crystals||0}
function legacyApply(){if(!S.legacy||!prog())return;prog().xp=S.legacy.xp||0;prog().crystals=S.legacy.crystals||0}
ensureV4();legacySync();save();
function promptTokens(t=''){let stop=new Set('a an the and or of to in is are was were be been being for with on at from by as this that which what when where how why best most first next student teacher school assessment data information following situation should would could'.split(' '));return [...new Set(String(t).toLowerCase().replace(/[^a-z0-9\s-]/g,' ').split(/\s+/).filter(w=>w.length>3&&!stop.has(w)))].slice(0,28)}
function qFingerprint(q){return promptTokens(cleanPrompt(q?.prompt||'')).sort().join('|')}
function jaccard(a,b){let A=new Set(String(a).split('|').filter(Boolean)),B=new Set(String(b).split('|').filter(Boolean));if(!A.size||!B.size)return 0;let inter=[...A].filter(x=>B.has(x)).length,uni=new Set([...A,...B]).size;return inter/uni}
const _pickAdaptiveV4Base=pickAdaptive;
pickAdaptive=function(pool=questionPool()){
 let p=prog(),hist=(p.questionMemory||[]).slice(-42),sessionIds=new Set(session?.questions||[]),recentIds=new Set(hist.slice(-22).map(h=>h.id)),recentFP=hist.slice(-16).map(h=>h.fp).filter(Boolean);
 let filtered=pool.filter(q=>!sessionIds.has(q.id)&&!recentIds.has(q.id)&&!recentFP.some(fp=>jaccard(qFingerprint(q),fp)>.63));
 if(filtered.length<Math.min(7,pool.length))filtered=pool.filter(q=>!sessionIds.has(q.id)&&!recentIds.has(q.id));
 if(filtered.length<3)filtered=pool.filter(q=>!sessionIds.has(q.id));
 if(!filtered.length)filtered=pool;
 let unseen=filtered.filter(q=>!hist.some(h=>h.id===q.id));if(unseen.length>=4&&Math.random()<.58)filtered=unseen;
 let q=_pickAdaptiveV4Base(filtered);return q||rand(filtered);
};
const _recordV4Base=record;
record=function(q,chosen,correct,confidence,mode){_recordV4Base(q,chosen,correct,confidence,mode);let p=prog(),fp=qFingerprint(q);p.questionMemory.push({id:q.id,fp,prompt:cleanPrompt(q.prompt),topicId:q.topicId,at:Date.now(),correct});if(p.questionMemory.length>180)p.questionMemory=p.questionMemory.slice(-180);p.bestCombo=Math.max(p.bestCombo||0,session?.combo||0);progressCompanion(correct,q);updateQuestClaims(false);legacySync();save()};
function progressCompanion(correct,q){let L=S.legacy,pet=activePet();if(correct){pet.bond=(pet.bond||0)+((q.difficulty||1)>=4?3:2);let egg=L.eggs?.[0];if(egg){egg.progress+=(q.difficulty||1)>=4?3:2;if(egg.progress>=egg.goal)hatchEgg(egg)}}else pet.bond=(pet.bond||0)+1}
function hatchEgg(egg){let L=S.legacy;if(!egg)return;let def=V4_PETS[egg.type],names={nova:'Nova',aurelia:'Aurelia',mallow:'Mallow',lyra:'Lyra',ember:'Ember'};let pet={id:'pet_'+Date.now(),type:egg.type,name:names[egg.type]||def.species,bond:0,hatched:true,hatchedAt:Date.now(),accessory:''};L.pets.push(pet);L.eggs=L.eggs.filter(e=>e.id!==egg.id);L.activePetId=pet.id;save();setTimeout(()=>showHatchOverlay(pet),80)}
function showHatchOverlay(pet){let d=petDef(pet),box=document.createElement('div');box.className='hatchOverlay';box.innerHTML=`<div class="hatchCard"><div class="hatchBig">${d.emoji}</div><div class="eyebrow">A new guardian has awakened</div><h2>${esc(pet.name)} hatched!</h2><p>Your new ${esc(d.species)} will grow from Baby → Guardian → Celestial form as you study.</p><button class="btn primary" onclick="this.closest('.hatchOverlay').remove();navigate('companions')">Meet my companion ✨</button></div>`;document.body.appendChild(box);transformationBurst()}
function petTip(q){let p=prog(),txt=cleanPrompt(q?.prompt||''),lower=txt.toLowerCase(),pet=activePet();if(session?.answered){if(session.chosen===q.answer)return `${pet.name}: That was it! Notice what clue made the best answer stronger than the almost-right choices. ✨`;return `${pet.name}: This is a repair moment, not a failure. Name the clue you missed before moving on.`}let recent=(p.answers||[]).slice(-16),same=recent.filter(a=>a.topicId===q.topicId&&!a.correct);if(same.length>=2)return `${pet.name}: This has been a trap topic for you. Slow down, name the concept, then compare the final two choices.`;if(/\b(first|initial|next)\b/.test(lower))return `${pet.name}: Sequence clue! Focus on what happens FIRST or NEXT, not what is generally true.`;if(/\b(best|most|primary|most appropriate)\b/.test(lower))return `${pet.name}: More than one answer may sound true. Choose the one that answers the exact task MOST directly.`;if(/consisten|repeat|vary|different scores/.test(lower))return `${pet.name}: Ask what kind of evidence problem the pattern is pointing to before reading the choices again.`;if(/compare|norm|peer|standard|criterion/.test(lower))return `${pet.name}: Identify what the score is being compared AGAINST. That usually separates the close choices.`;return `${pet.name}: Read the final sentence first, find the controlling clue, then eliminate choices that are true but answer a different question.`}
function petCoachHTML(){if(!session||session.finished||!session.current||session.focus)return '';let pet=activePet(),d=petDef(pet),stage=petStage(pet);return `<div class="petCoach" id="petCoach"><div class="petFace">${d.emoji}</div><div><div class="tipTitle">${esc(pet.name)} • ${stage} ${esc(d.species)}</div><p>${esc(petTip(session.current))}</p>${!session.answered?`<button class="petAbility" onclick="usePetAbility()">✨ ${esc(d.abilityName)}</button>`:''}</div></div>`}
function usePetAbility(){if(!session||session.answered)return;let pet=activePet(),d=petDef(pet);session.petAbilityCooldown=session.petAbilityCooldown||0;if(session.index-(session.lastPetAbilityAt||-99)<4)return rewardToast('Guardian is recharging','Abilities recharge after 4 questions.');session.lastPetAbilityAt=session.index;prog().petAbilityUses=(prog().petAbilityUses||0)+1;
 if(d.ability==='clue'){session.petHint=session.current.keyClue||'Focus on the final task and the most specific clue in the stem.';rewardToast('🌙 Moonbeam Clue',session.petHint)}
 else if(d.ability==='eliminate'){let wrong=session.current.options.filter(o=>o!==session.current.answer);session.petEliminated=rand(wrong);render();rewardToast('🦊 Starfire Sweep','One weaker choice has been crossed out.')}
 else if(d.ability==='lens'){session.petHint='Compare the two strongest choices: which one addresses the exact final task with the fewest assumptions?';rewardToast('🦉 Crystal Lens',session.petHint)}
 else if(d.ability==='shield'){session.petShield=true;rewardToast('🐇 Ribbon Shield','Your next wrong answer will not break your combo.')}
 else if(d.ability==='boost'){session.petRewardBoost=true;rewardToast('🦌 Heartlight Boost','Your next hard correct answer earns bonus crystals.')}
 else if(d.ability==='boss'){if(['boss','bossrush'].includes(session.type)){session.playerHP=Math.min(9,(session.playerHP||5)+1);render();rewardToast('🐉 Guardian Flame','One boss-battle heart restored.')}else rewardToast('🐉 Guardian Flame','This ability shines brightest in Boss Battle.')}
 save()}
const _nextQuestionV4Base=nextQuestion;
nextQuestion=function(){if(session){session.petEliminated=null;session.petHint=null}let r=_nextQuestionV4Base();if(session?.current&&Array.isArray(session.questions)){let id=session.current.id;if(!session.questions.some(x=>(typeof x==='string'?x:x?.id)===id))session.questions.push(id)}return r};
const _answerQV4Base=answerQ;
answerQ=function(chosen){if(!session||session.answered)return;let before=session.combo||0,shield=session.petShield,boost=session.petRewardBoost,q=session.current,correct=chosen===q.answer;_answerQV4Base(chosen);if(shield&&!correct){session.combo=Math.max(1,before);session.petShield=false;rewardToast('🎀 Ribbon Shield saved your combo','Your guardian protected the streak.')}if(boost&&correct&&(q.difficulty||1)>=4){prog().crystals=(prog().crystals||0)+4;session.petRewardBoost=false;legacySync();save();rewardToast('+4 bonus 💎','Heartlight rewarded a hard answer.')}if(correct&&session?.combo&&[3,5,10,15].includes(session.combo))comboCelebration(session.combo);save();setTimeout(()=>render(),30)};
function comboCelebration(n){let msg=n>=15?'Eternal Transformation!':n>=10?'Celestial Transformation!':n>=5?'Crystal Transformation!':'Moonlight Combo!';rewardToast(`✨ ${msg}`,`${n} correct in a row`);glitterBurst(22+n*2);if(n>=10)transformationBurst()}
const _grantMoonlightV4Base=grantMoonlight;
grantMoonlight=function(q){_grantMoonlightV4Base(q);legacySync();save()};
function todaysAnswers(){let d=new Date().toDateString();return (prog().answers||[]).filter(a=>new Date(a.at).toDateString()===d)}
function dailyQuestStatus(){let a=todaysAnswers(),hard=a.filter(x=>x.correct&&x.difficulty>=4).length,qs=a.length,expl=(prog().explanations||[]).filter(x=>new Date(x.at).toDateString()===new Date().toDateString()).length;let repaired=new Set(a.filter(x=>x.correct&&(prog().answers||[]).some(y=>y.at<x.at&&!y.correct&&y.topicId===x.topicId)).map(x=>x.topicId)).size;return [{icon:'🌙',name:'Moon Patrol',n:qs,goal:10,text:'Answer 10 questions'},{icon:'⚔️',name:'Guardian Trial',n:hard,goal:5,text:'Get 5 hard questions correct'},{icon:'💗',name:'Repair Magic',n:repaired,goal:2,text:'Repair 2 previously missed concepts'},{icon:'🎤',name:'Voice of Knowledge',n:expl,goal:2,text:'Explain 2 answers in your own words'}]}
function mondayStart(){let d=new Date(),day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return d.getTime()}
function weeklyStatus(){let a=(prog().answers||[]).filter(x=>x.at>=mondayStart()),topics=new Set(a.map(x=>x.topicId).filter(Boolean));return {n:topics.size,goal:Math.min(10,Math.max(6,(course().concepts||[]).length>10?8:6)),topics}}

record=function(q,chosen,correct,confidence,mode){_recordAscBase(q,chosen,correct,confidence,mode);let p=prog();p.questionExposure[q.id]=(p.questionExposure[q.id]||0)+1;if(!correct&&q.keyClue){S.asc.clueBook[q.topicId]=S.asc.clueBook[q.topicId]||{};S.asc.clueBook[q.topicId][q.keyClue]=(S.asc.clueBook[q.topicId][q.keyClue]||0)+1}save()}

/* topic saturation guard */
const _pickAdaptiveAscBase=pickAdaptive;
pickAdaptive=function(pool=questionPool()){if(!pool.length)return null;let recent=(prog().answers||[]).slice(-8),counts={};for(const a of recent)counts[a.topicId]=(counts[a.topicId]||0)+1;let cap=Number(S.asc.settings.topicCap||3);let under=pool.filter(q=>(counts[q.topicId]||0)<cap);if(under.length>=6&&!session?.opts?.topics?.length&&!session?.currentWasRepair)pool=under;return _pickAdaptiveAscBase(pool)}

/* rushed-answer guard; only hard non-test questions */
const _answerAscBase=answerQ;
answerQ=function(chosen){if(session&&!session.answered&&S.asc.settings.rushGuard&&!session.finalTransformation&&session.type!=='test'&&(session.current?.difficulty||1)>=4&&!session.ascRushConfirmed){let ms=Date.now()-(session.questionStartedAt||Date.now());if(ms<4000){session.ascRushConfirmed=true;if(!confirm('🌙 This is a hard question and you answered in under 4 seconds. Want to lock that answer in?')){session.ascRushConfirmed=false;return}}} _answerAscBase(chosen); if(session)session.ascRushConfirmed=false}

/* error taxonomy + closest-two */
function ascTagError(tag){let p=prog(),a=p.answers?.at(-1);if(!a||a.correct)return;let rec={qid:a.qid,topicId:a.topicId,tag,at:Date.now()};p.errorTags.push(rec);if(p.errorTags.length>300)p.errorTags=p.errorTags.slice(-300);a.errorTag=tag;save();rewardToast('📕 Mistake tagged',tag)}
function ascClosestTwo(q){if(!q||!session)return;let wrong=session.chosen&&session.chosen!==q.answer?session.chosen:q.options.find(o=>o!==q.answer);let pick=prompt(`Closest-Two Showdown\n\nA = ${q.answer}\nB = ${wrong}\n\nType A or B for the BEST answer.`);if(!pick)return;let ok=pick.trim().toUpperCase()==='A';if(ok){rewardToast('✨ Strong discrimination','You separated the best answer from the tempting alternative.');prog().xp=(prog().xp||0)+4}else rewardToast('🌙 Compare the controlling clue',q.keyClue||q.why||'Focus on what the stem actually asks.');save()}

/* feedback upgrades */
const _feedbackAscBase=feedbackHTML;
feedbackHTML=function(q){let base=_feedbackAscBase(q),wrong=session?.chosen!==q.answer,ai=q.aiGenerated;let tags=wrong?`<div class="ascPanel"><b>What happened?</b><div class="ascErrorTags">${['Misread stem','Term confusion','Overthought it','Rushed','Guessed'].map(t=>`<button onclick="ascTagError('${t}')">${t}</button>`).join('')}</div></div>`:'';let showdown=`<div class="ascShowdown"><b>⚔️ Closest-Two Showdown</b><p>Practice separating the best answer from the most tempting alternative.</p><button class="btn ghost" onclick="ascClosestTwo(session.current)">Compare the final two</button></div>`;let air=ai?`<div class="ascPanel"><b>🔮 Rate this generated question</b> <button class="btn good" onclick="ascRateAI(1)">Useful</button> <button class="btn ghost" onclick="ascRateAI(-1)">Quarantine</button></div>`:'';return base+tags+showdown+air+(session?.ascRewardNote?`<p class="ascTiny">${esc(session.ascRewardNote)}</p>`:'')}
function ascRateAI(v){let q=session?.current;if(!q?.aiGenerated)return;S.asc.aiRatings[q.id]=v;if(v<0){prog().flaggedQuestions[q.id]={reason:'AI question quarantined by learner',at:Date.now(),prompt:cleanPrompt(q.prompt)};for(const k of Object.keys(S.asc.aiCache))S.asc.aiCache[k]=(S.asc.aiCache[k]||[]).filter(x=>x.id!==q.id);rewardToast('🛡️ Question quarantined','It will not return to practice.')}else rewardToast('✨ Oracle learned','This question can stay in the approved challenge vault.');save()}

/* help fade */
const _usePetAscBase=usePetAbility;
usePetAbility=function(){let q=session?.current,m=q?v5Mastery(q.topicId):null;if(S.asc.settings.helpFade&&m?.level==='durable'&&!session?.finalTransformation){if(!confirm('This concept has durable independent evidence. Use a hint anyway? It will count as assisted practice.'))return}_usePetAscBase()}

/* smarter AI cache + source lock */
function ascKnownTerms(q){let sec=v5StudySection(q.topicId),gl=Object.keys(course().glossary||{});let arr=[v5ConceptTitle(q.topicId),...(sec?.rows||[]).flat(),...gl];return new Set(arr.join(' ').toLowerCase().match(/[a-z][a-z-]{3,}/g)||[])}
function ascSourceLock(nq,sourceQ){let known=ascKnownTerms(sourceQ),words=(nq.prompt+' '+nq.options.join(' ')).toLowerCase().match(/[a-z][a-z-]{4,}/g)||[];let academic=words.filter(w=>known.has(w)).length;return academic>=2||sourceQ.topicId==='prereferral_steps'||sourceQ.topicId==='law_mixed'}
const _gateAscBase=v5AIQualityGate;
v5AIQualityGate=function(nq,sourceQ){let g=_gateAscBase(nq,sourceQ);if(!g.ok)return g;if(S.v5.settings.noNewConcepts&&!ascSourceLock(nq,sourceQ))return {ok:false,why:'Source-lock check: too little overlap with active course language'};return {ok:true}}
const _requestAIAscBase=requestAIChallenge;
requestAIChallenge=async function(q){let cached=(S.asc.aiCache[q.topicId]||[]).filter(x=>!prog().flaggedQuestions?.[x.id]&&!((prog().answers||[]).slice(-35).some(a=>a.qid===x.id)));if(cached.length&&!session?.finalTransformation){session.aiQueue=session.aiQueue||[];session.aiQueue.push(cached.shift());S.asc.aiCache[q.topicId]=cached;save();return}_requestAIAscBase(q);setTimeout(()=>{let arr=session?.aiQueue||[];for(const nq of arr.filter(x=>x.aiGenerated)){S.asc.aiCache[nq.topicId]=S.asc.aiCache[nq.topicId]||[];if(!S.asc.aiCache[nq.topicId].some(x=>x.id===nq.id))S.asc.aiCache[nq.topicId].push(nq)}save()},100)}

/* fatigue governor */
const _continueAscBase=continueSession;
continueSession=function(){let f=v5Fatigue();if(f.on&&!session?.finalTransformation&&!session?.ascFatigueShown){session.ascFatigueShown=true;if(confirm('🫖 Your recent response time increased while accuracy dropped. Pause this mission and switch to a short Final Moon Review?')){session=null;S.screen='finalreview';save();render();return}}_continueAscBase()}

/* Mastery receipts */
function ascMasteryReceipt(id){let m=v5Mastery(id);return `<div class="ascReceipt"><b>${esc(v5ConceptTitle(id))}</b><span>${m.level}</span><span>${Math.round(m.acc*100)}% recent</span><span>${m.independent} independent</span><span>${m.hard} hard</span><span>${m.days} day${m.days===1?'':'s'}</span></div>`}
function ascTrapLibrary(){let p=prog(),tr=[];for(const [topic,opts] of Object.entries(p.distractorHistory||{}))for(const [choice,n] of Object.entries(opts))tr.push({topic,choice,n});tr.sort((a,b)=>b.n-a.n);let tags={};for(const x of p.errorTags||[])tags[x.tag]=(tags[x.tag]||0)+1;let clues=[];for(const [topic,obj] of Object.entries(S.asc.clueBook||{}))for(const [clue,n] of Object.entries(obj))clues.push({topic,clue,n});clues.sort((a,b)=>b.n-a.n);return {tr:tr.slice(0,8),tags:Object.entries(tags).sort((a,b)=>b[1]-a[1]),clues:clues.slice(0,8)}}

/* import + merge */
async function ascMergeSave(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text()),ns=x.state||x;if(!ns.progress||!ns.courses)throw Error('Not a Moonlit save.');let oldAns=Object.values(ns.progress).reduce((n,p)=>n+(p.answers||[]).length,0),curAns=v5TotalAnswers();if(!confirm(`Merge this save?\n\nCurrent answers: ${curAns}\nImported answers: ${oldAns}\n\nAnswers are de-duplicated by question/time where possible; rewards use the higher value.`))return;for(const [cid,np] of Object.entries(ns.progress)){S.progress[cid]=S.progress[cid]||{};let cp=S.progress[cid];let seen=new Set((cp.answers||[]).map(a=>`${a.qid}|${a.at||''}|${a.chosen||''}`));cp.answers=cp.answers||[];for(const a of np.answers||[]){let k=`${a.qid}|${a.at||''}|${a.chosen||''}`;if(!seen.has(k)){cp.answers.push(a);seen.add(k)}}cp.explanations=[...(cp.explanations||[]),...(np.explanations||[])].slice(-1000);for(const k of ['xp','crystals','bossWins','chests'])cp[k]=Math.max(cp[k]||0,np[k]||0);cp.charms=[...new Set([...(cp.charms||[]),...(np.charms||[])])];}
 if(ns.legacy){S.legacy=S.legacy||{};for(const k of ['pets','eggs','realms','accessories','decor'])S.legacy[k]=[...new Set([...(S.legacy[k]||[]),...(ns.legacy[k]||[])])];}
 S.asc.mergeLog.push({at:Date.now(),file:f.name,answersBefore:curAns,answersImported:oldAns});ensureV4();ensureV5();ensureAsc();save();session=null;S.screen='home';render();alert('Progress merged successfully. ✨')}catch(err){alert('Merge failed: '+err.message)}}

/* post-test repair */
function ascBuildPostTestRepair(){let rev=session?.review||[];let wrong=[...new Set(rev.filter(x=>!x.correct).map(x=>x.q.topicId))];S.asc.postTestRepair=wrong.slice(0,6);save();return wrong}
const _finishAscBase=finishSession;
finishSession=function(){let wasTest=session?.type==='test'||session?.finalTransformation;_finishAscBase();if(session?.finished){let total=session.type==='test'?(session.review||[]).length:Math.max(1,session.index-1),recent=(prog().answers||[]).slice(-total),acc=recent.length?recent.filter(x=>x.correct).length/recent.length:0,ind=recent.length?recent.filter(x=>x.correct&&!x.assisted).length/recent.length:0,avg=recent.filter(x=>x.responseMs).length?recent.filter(x=>x.responseMs).reduce((n,x)=>n+x.responseMs,0)/recent.filter(x=>x.responseMs).length:0;S.asc.sessionDebriefs.push({at:Date.now(),type:session.type,total,acc,ind,avgMs:avg});S.asc.sessionDebriefs=S.asc.sessionDebriefs.slice(-60);if(wasTest)ascBuildPostTestRepair();save()}}
function ascStartPostTestRepair(){let t=S.asc.postTestRepair||[];if(!t.length)return alert('No missed-concept repair set is waiting.');startSession('repair',{label:'🛠️ Post-Simulation Repair',topics:t,limit:Math.min(10,Math.max(5,t.length*2)),hard:true,noAI:true});render()}

/* OA readiness gate for imported courses */
const _startFinalTestAscBase=startFinalTransformationTest;
startFinalTransformationTest=function(){if(!ascCourseReady(course())){alert('This course pack is not yet deep enough for a high-stakes simulation. Add stronger source material/questions first.');S.screen='add';render();return}_startFinalTestAscBase()}

/* performance mode + lock */
function ascApplyBody(){document.body.classList.toggle('ascLowMotion',!!S.asc.settings.performance);document.body.classList.toggle('ascFrozen',!!S.asc.settings.testWeekLock)}
function ascToggle(k){S.asc.settings[k]=!S.asc.settings[k];save();render()}
function ascLock(){S.asc.settings.testWeekLock=true;S.v5.settings.freezeUpdates=true;S.v5.settings.noNewConcepts=true;save();render();rewardToast('🔒 Test Week Locked','No experimental settings or new concepts until you unlock it.')}
function ascUnlock(){if(confirm('Unlock experimental changes before the test? The stable study system is currently frozen.')){S.asc.settings.testWeekLock=false;save();render()}}

/* strategy page */
function strategyHTML(){let lib=ascTrapLibrary(),risk=ascRiskRows(),d=S.asc.sessionDebriefs.at(-1),ready=ascCourseReady(course());return `<div class="sectionTitle"><div><h2>🧠 Strategy Lab</h2><p>Use your own study data to improve how you choose answers—not just how many questions you complete.</p></div><span class="rankBadge">${ASC_VERSION}</span></div>
<div class="ascPanel"><h3>Mission Settings</h3><div class="ascControls"><label>Study Me length <select onchange="ascSetBudget(this.value)">${[5,10,12,15,20].map(n=>`<option value="${n}" ${ascBudget()===n?'selected':''}>${n} questions</option>`).join('')}</select></label><label><input type="checkbox" ${S.asc.settings.rushGuard?'checked':''} onchange="ascToggle('rushGuard')"> Rushed-answer guard</label><label><input type="checkbox" ${S.asc.settings.helpFade?'checked':''} onchange="ascToggle('helpFade')"> Fade hints after mastery</label><label><input type="checkbox" ${S.asc.settings.performance?'checked':''} onchange="ascToggle('performance')"> Performance mode</label></div></div>
<div class="grid"><div class="card c7"><h3>Mastery Receipts</h3><p class="tiny">A green-looking percentage is not enough. These receipts show the evidence supporting your status.</p>${risk.map(x=>ascMasteryReceipt(x.id)).join('')}</div><div class="card c5"><h3>Trap Library</h3>${lib.tr.length?lib.tr.map(x=>`<div class="ascTrap"><b>${esc(v5ConceptTitle(x.topic))}</b><span>${esc(x.choice)}</span><em>${x.n}×</em></div>`).join(''):'<p>No repeated distractor pattern yet.</p>'}<h4>Error patterns</h4>${lib.tags.length?lib.tags.map(([t,n])=>`<span class="ascTag hot">${esc(t)} • ${n}</span>`).join(''):'<span class="tiny">Tag a few misses to build this.</span>'}</div>
<div class="card c7"><h3>Personal Clue Dictionary</h3>${lib.clues.length?lib.clues.map(x=>`<div class="ascTrap"><b>${esc(v5ConceptTitle(x.topic))}</b><span>${esc(x.clue)}</span><em>${x.n} miss${x.n===1?'':'es'}</em></div>`).join(''):'<p>Clue language from missed questions will collect here.</p>'}</div><div class="card c5"><h3>Course Quality</h3><div class="ascQuality"><span>✅ ${course().questionBank?.length||0} active questions</span><span>📚 ${course().concepts?.length||0} concepts</span><span>🧪 ${course().id==='PMFC'?'212 source questions archived':'course-specific source pack'}</span><span>${ready?'✅ OA simulation ready':'⚠️ build more before simulation'}</span></div><p class="tiny">PMFC intentionally uses the strongest active question set; weak giveaway items remain archived rather than polluting practice.</p></div></div>
${d?`<div class="ascPanel"><h3>Last Session Debrief</h3><div class="ascDebrief"><div><b>${Math.round(d.acc*100)}%</b><small>accuracy</small></div><div><b>${Math.round(d.ind*100)}%</b><small>independent</small></div><div><b>${d.avgMs?Math.round(d.avgMs/1000)+'s':'—'}</b><small>avg response</small></div><div><b>${d.total}</b><small>questions</small></div></div>${S.asc.postTestRepair?.length?'<p><button class="btn violet" onclick="ascStartPostTestRepair()">🛠️ Repair missed simulation concepts</button></p>':''}</div>`:''}
<div class="ascPanel"><h3>Progress Merge & Safety</h3><p>Use this only if progress from an older Moonlit folder did not carry over automatically.</p><label class="btn ghost" style="cursor:pointer">🔄 Merge Older Save<input type="file" accept=".json" style="display:none" onchange="ascMergeSave(event)"></label> <button class="btn dark" onclick="exportSave()">⬇ Export Current Save</button></div>
<div class="ascPanel"><h3>25 additional critique-driven upgrades</h3><div class="v5Improvements">${ASC_ADDITIONS.map((x,i)=>`<div><b>${i+1}</b><span>${esc(x)}</span></div>`).join('')}</div></div>`}

/* exam day page */
function examDayHTML(){let risks=ascRiskRows().slice(0,4),f=v5Fatigue();return `<div class="sectionTitle"><div><h2>👑 Exam-Day Checklist</h2><p>No new material. Protect retrieval, pacing, and judgment.</p></div><span class="rankBadge">TEST WEEK</span></div><div class="grid"><div class="card c7"><h3>Highest-risk concepts</h3>${risks.map(x=>`<div class="v5Risk"><span>✦</span><div><b>${esc(x.title)}</b><small>${Math.round(x.m.acc*100)}% recent • ${x.m.level}</small></div><button class="btn ghost" onclick="practiceTopics(['${x.id}'])">5-minute repair</button></div>`).join('')}</div><div class="card c5"><h3>Decision rules</h3><p>① Identify what the stem is actually asking.</p><p>② Find the controlling clue—not every true detail.</p><p>③ Eliminate answers that are true but answer a different question.</p><p>④ When two answers remain, choose the one that addresses the exact decision in the stem.</p><p>⑤ Do not change an answer without a specific reason from the stem.</p>${f.on?'<div class="ascWarn"><b>Fatigue signal is on.</b> Stop grinding and rest before another simulation.</div>':'<div class="ascGood"><b>No current fatigue signal.</b> Keep sessions finite.</div>'}<button class="btn violet" onclick="startFinalMoonReview()">🌙 Final Moon Review</button></div></div>`}

/* home + nav integration */
const _homeAscBase=homeHTML;
homeHTML=function(){return ascCompassHTML()+_homeAscBase()}
const _sideAscBase=sideHTML;
sideHTML=function(){const nav=[['home','🏰','Home'],['mission','🎯','Study Now'],['finalreview','🌙','Final Review'],['guide','📖','Study Guide'],['games','🎮','Game Realm'],['companions','🥚','Companions'],['constellation','🌌','Constellation'],['grimoire','📕','Mistake Grimoire'],['vault','💎','Magic Vault'],['trophies','🏆','Trophies'],['test','📝','OA Practice'],['analytics','📊','Analytics'],['strategy','🧠','Strategy Lab'],['examday','👑','Exam Day'],['control','⚙️','Control Room'],['sources','📚','Sources'],['add','➕','Add Class']];let pet=activePet(),d=petDef(pet);return `<div class="brand"><div class="brandmark">☾</div><div class="txt"><b>Moonlit<br>Mastery</b><small>Ascension Test Week</small></div></div><nav class="nav">${nav.map(([id,ic,l])=>`<button data-nav="${id}" class="${S.screen===id?'active':''}" onclick="navigate('${id}')"><span>${ic}</span> <span class="label">${l}</span></button>`).join('')}</nav><div class="sidefoot"><span class="moon">${d.emoji}</span><div class="copy"><b>${esc(pet.name)} • ${petStage(pet)}</b><small>${dayStreak()} day streak • ${esc(rankInfo().name)}</small><div class="rewardStrip" style="margin-top:9px"><span class="rewardChip">✨ ${prog().xp||0}</span><span class="rewardChip">💎 ${prog().crystals||0}</span><span class="rewardChip">🎁 ${prog().chests||0}</span></div></div></div>`}
const _screenAscBase=screenHTML;
screenHTML=function(){if(S.screen==='strategy')return strategyHTML();if(S.screen==='examday')return examDayHTML();return _screenAscBase()}

/* control additions */
const _controlAscBase=controlHTML;
controlHTML=function(){let lock=S.asc.settings.testWeekLock;let base=_controlAscBase().replace(V5_VERSION,ASC_VERSION);return base+`<div class="ascPanel"><h3>🔒 Test Week Lock</h3><p>${lock?'The build is frozen. New concepts and experimental changes are blocked.':'The build is unlocked.'}</p>${lock?'<button class="btn ghost" onclick="ascUnlock()">Unlock (not recommended before exam)</button>':'<button class="btn dark" onclick="ascLock()">Lock Test Week Build</button>'}</div>`}

/* stopping-rule cue after enough work */
function ascStopRule(){if(!session||session.finished||session.finalTransformation)return;let f=v5Fatigue(),answered=Math.max(0,session.index-1);if((f.on||answered>=ascBudget())&&!document.getElementById('ascStop')){let div=document.createElement('div');div.id='ascStop';div.className='ascStop';div.innerHTML=`<b>${f.on?'🫖 Diminishing returns detected':'✨ Session goal reached'}</b><p>${f.on?'Your speed/accuracy pattern suggests a short break will help more than another hard question.':'You reached your planned question budget. You can stop with a clean win or continue intentionally.'}</p><button class="btn violet" onclick="finishSession();document.getElementById('ascStop')?.remove()">Finish & debrief</button> <button class="btn ghost" onclick="document.getElementById('ascStop')?.remove()">Continue</button>`;document.body.appendChild(div)}}
const _renderAscBase=render;
render=function(){_renderAscBase();ascApplyBody();setTimeout(ascStopRule,0)}

/* portable save carries the final build version */
exportSave=function(){let payload={type:'MoonlitMasterySave',version:ASC_VERSION,exportedAt:new Date().toISOString(),state:S};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Moonlit_Mastery_Ascension_Save_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* tag current course progress explicitly for separation */
for(const [cid,p] of Object.entries(S.progress||{}))p.courseId=cid;
try{save()}catch(_){ }
setTimeout(()=>{try{render()}catch(e){console.error('Ascension initial render',e)}},0);

</script>

<script id="majickCloudAI">
/* ===== Majick Studies • Supabase Cloud AI =====
   OpenAI API key stays in Supabase Secrets.
   Browser stores only the Supabase public key + your personal Majick app token.
*/
const MAJICK_CLOUD_KEYS={
  endpoint:'majick_cloud_ai_endpoint',
  publishable:'majick_cloud_ai_publishable',
  appToken:'majick_cloud_ai_token',
  clientId:'majick_cloud_ai_client_id'
};

function majickCloudConfig(){
  let clientId=localStorage.getItem(MAJICK_CLOUD_KEYS.clientId);
  if(!clientId){
    clientId=(crypto?.randomUUID?.()||('majick_'+Date.now()+'_'+Math.random().toString(36).slice(2)));
    localStorage.setItem(MAJICK_CLOUD_KEYS.clientId,clientId);
  }
  return {
    endpoint:(localStorage.getItem(MAJICK_CLOUD_KEYS.endpoint)||'').trim(),
    publishable:(localStorage.getItem(MAJICK_CLOUD_KEYS.publishable)||'').trim(),
    appToken:(localStorage.getItem(MAJICK_CLOUD_KEYS.appToken)||'').trim(),
    clientId
  };
}
function majickCloudConfigured(){
  const c=majickCloudConfig();
  return !!(c.endpoint && c.publishable && c.appToken);
}
function majickCloudHeaders(){
  const c=majickCloudConfig();
  return {
    'Content-Type':'application/json',
    'apikey':c.publishable,
    'Authorization':'Bearer '+c.publishable,
    'x-majick-token':c.appToken,
    'x-majick-client':c.clientId
  };
}
async function majickCloudRequest(payload, timeoutMs=18000){
  const c=majickCloudConfig();
  if(!majickCloudConfigured()) throw new Error('Cloud AI is not configured');
  const ctrl=new AbortController();
  const tm=setTimeout(()=>ctrl.abort(),timeoutMs);
  try{
    const r=await fetch(c.endpoint,{
      method:'POST',
      headers:majickCloudHeaders(),
      body:JSON.stringify({...payload,clientId:c.clientId}),
      signal:ctrl.signal
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data?.error||data?.message||('Cloud AI error '+r.status));
    return data;
  }finally{clearTimeout(tm)}
}
async function majickCloudHealth(){
  const c=majickCloudConfig();
  if(!majickCloudConfigured()) return {ok:false,message:'Not configured'};
  const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),5000);
  try{
    const r=await fetch(c.endpoint,{method:'GET',headers:majickCloudHeaders(),signal:ctrl.signal});
    const data=await r.json().catch(()=>({}));
    return {ok:r.ok&&!!data.ok,...data};
  }catch(e){return {ok:false,message:e.message}}
  finally{clearTimeout(tm)}
}

/* Override the old local-only AI forge.
   Cloud AI is preferred. The legacy localhost bridge remains a fallback. */
requestAIChallenge=async function(q){
  if(!session || session.aiRequestPending || session.aiQueue?.length) return;
  session.aiRequestPending=true;
  try{
    let topic=course().concepts.find(c=>c.id===q.topicId)?.title||q.topicId;
    let history=(prog().questionMemory||[]).slice(-24).map(x=>x.prompt).filter(Boolean);
    let related=questionPool({topics:[q.topicId]})
      .filter(x=>x.id!==q.id)
      .slice(0,10)
      .map(x=>({
        prompt:cleanPrompt(x.prompt),
        options:x.options,
        answer:x.answer,
        why:x.why,
        difficulty:x.difficulty,
        keyClue:x.keyClue,
        distractorCoach:x.distractorCoach
      }));
    let body={
      courseId:course().id,
      courseTitle:course().title,
      topic,
      topicId:q.topicId,
      targetDifficulty:Math.min(5,(q.difficulty||3)+1),
      glossary:course().glossary,
      related,
      avoidPrompts:history,
      requirements:'Create a NEW application/scenario question. All four choices must sound academically plausible and belong to the same conceptual neighborhood. Exactly one answer must be best because of a controlling clue. Never say WGU-style or WGU would. Avoid silly distractors, all/none of the above, giveaways, or wording similar to recent questions.'
    };

    let nq;
    if(majickCloudConfigured()){
      nq=await majickCloudRequest(body);
    }else{
      /* Existing local bridge fallback, so studying still works offline. */
      let ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),7000);
      let r=await fetch(AI_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body),
        signal:ctrl.signal
      });
      clearTimeout(tm);
      if(!r.ok) throw Error('AI unavailable');
      nq=await r.json();
    }

    let fp=qFingerprint(nq);
    let tooSimilar=(prog().questionMemory||[]).slice(-24).some(h=>jaccard(fp,h.fp)>.60);
    if(nq && Array.isArray(nq.options) && nq.options.length===4 &&
       nq.answer && nq.options.includes(nq.answer) && !tooSimilar){
      nq.id=nq.id||'ai_'+Date.now();
      nq.topicId=q.topicId;
      nq.section=q.section;
      nq.difficulty=Math.max(4,nq.difficulty||4);
      nq.format='ai_challenge';
      nq.aiGenerated=true;
      nq.cloudGenerated=majickCloudConfigured();
      session.aiQueue=session.aiQueue||[];
      session.aiQueue.push(nq);
      prog().aiGeneratedCount=(prog().aiGeneratedCount||0)+1;
      save();
      rewardToast('🔮 Majick Oracle forged a harder challenge','New scenario • plausible distractors • same course facts');
    }
  }catch(e){
    console.warn('Majick AI Forge:',e);
  }finally{
    session.aiRequestPending=false;
  }
};

  return a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length/1000):0;
}
function mcEvidenceLabel(){
  const st=stats(),n=st.a.length;
  if(n<15) return {label:'Insufficient evidence',tone:'muted'};
  if(st.acc>=.80&&st.hardAcc>=.72&&st.floor>=.65) return {label:'Strong evidence',tone:'strong'};
  if(st.acc>=.68) return {label:'Developing evidence',tone:'developing'};
  return {label:'Needs focused repair',tone:'weak'};
}
function mcLearningProfile(){
  const a=mcAnswers().slice(-80),st=stats();
  const highWrong=a.filter(x=>!x.correct&&x.confidence==='certain').length;
  const withHelp=a.filter(x=>x.helpUsed||x.usedHint).length;
  const hard=a.filter(x=>(x.difficulty||0)>=4);
  let notes=[];
  if(highWrong>=3) notes.push('High-confidence misconceptions deserve priority repair.');
  if(withHelp>Math.max(4,a.length*.25)) notes.push('You are using support often; the app should fade hints on familiar concepts.');
  if(hard.length>=6 && hard.filter(x=>x.correct).length/hard.length<.65) notes.push('Your main growth edge is difficult application/discrimination questions.');
  if(mcAverageTime()>55) notes.push('You are accurate more slowly than ideal; timed mixed practice may help recognition speed.');
  if(st.acc>=.78&&st.hardAcc<st.acc-.15) notes.push('Recall is stronger than transfer. Keep pushing scenario questions.');
  if(!notes.length) notes.push('Your current pattern supports mixed retrieval with occasional hard-question escalation.');
  return notes;
}
function mcRiskTopics(n=4){
  if(typeof v5RiskTopics==='function') return v5RiskTopics(n);

function mcBindRoomDrag(){
  const room=document.getElementById('mcSanctuary');if(!room)return;
  room.querySelectorAll('.mcDecor').forEach(el=>{
    el.style.cursor=mcRoomEditing?'grab':'default';
    if(!mcRoomEditing)return;
    el.onpointerdown=(e)=>{
      e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add('dragging');
      const rect=room.getBoundingClientRect();
      const move=(ev)=>{
        let x=Math.max(2,Math.min(94,(ev.clientX-rect.left)/rect.width*100));
        let y=Math.max(10,Math.min(82,(ev.clientY-rect.top)/rect.height*100));
        el.style.left=x+'%';el.style.top=y+'%';
      };
      const up=(ev)=>{
        el.releasePointerCapture(ev.pointerId);el.classList.remove('dragging');
        el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);
        const item=mcEnsureRoom().items.find(x=>x.id===el.dataset.decor);
        if(item){item.x=parseFloat(el.style.left);item.y=parseFloat(el.style.top);save()}
      };
      el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);

  })

let mcAudioCtx=null,mcNoise=null,mcGain=null;
function mcToggleAmbience(){
  const C=mcState();C.settings.ambience=!C.settings.ambience;save();

function mcStartAmbience(){
  try{
    mcAudioCtx=mcAudioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const len=mcAudioCtx.sampleRate*2,buf=mcAudioCtx.createBuffer(1,len,mcAudioCtx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*.16;
    mcNoise=mcAudioCtx.createBufferSource();mcNoise.buffer=buf;mcNoise.loop=true;
    const filter=mcAudioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=480;
    mcGain=mcAudioCtx.createGain();mcGain.gain.value=.035;
    mcNoise.connect(filter).connect(mcGain).connect(mcAudioCtx.destination);mcNoise.start();
  }catch(e){console.warn(e)}
}
function mcStopAmbience(){try{mcNoise?.stop()}catch(_){}mcNoise=null}

makeEgg=function(source='chest'){
