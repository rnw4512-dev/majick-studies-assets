<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc"><title id="title">Math and science Venn diagram</title><desc id="desc">Of 40 students, 13 take only math, 5 take both, 7 take only science, and 15 take neither.</desc><rect x="2" y="2" width="476" height="296" rx="12" fill="#fbefd7" stroke="#725a38" stroke-width="3"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#21192c"><text x="240" y="30" font-size="20">Sample space: 40 students</text><circle cx="180" cy="155" r="85" fill="#71b9c3" fill-opacity=".45" stroke="#236a78" stroke-width="3"/><circle cx="300" cy="155" r="85" fill="#e7a365" fill-opacity=".45" stroke="#a9551d" stroke-width="3"/><text x="158" y="92" font-size="18">Math</text><text x="320" y="92" font-size="18">Science</text><text x="154" y="165" font-size="30">13</text><text x="240" y="165" font-size="30">5</text><text x="326" y="165" font-size="30">7</text><text x="240" y="275" font-size="20">Neither: 15</text></g></svg>
