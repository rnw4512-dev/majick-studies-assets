<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" role="img" aria-labelledby="title desc"><title id="title">Quartiles and IQR for the supplied fourteen-value data set</title><desc id="desc">Minimum 1, first quartile 2, median 7, third quartile 9, maximum 11.5. The box spans Q1 to Q3, a distance of 7, containing the middle half of ordered observations.</desc><g fill="none" stroke="#ead3a5" stroke-width="2"><path d="M45 100H570M45 85V115M570 85V115"/><rect x="95" y="70" width="400" height="60" fill="#795a9366"/><path d="M345 70V130M95 45H495M95 38V52M495 38V52"/></g><g fill="#f2e5cc" text-anchor="middle" font-family="sans-serif" font-size="14"><text x="295" y="27">IQR = Q3 − Q1 = 9 − 2 = 7</text><text x="45" y="155">Min 1</text><text x="95" y="177">Q1 = 2</text><text x="345" y="155">Median 7</text><text x="495" y="177">Q3 = 9</text><text x="570" y="155">Max 11.5</text></g></svg>
