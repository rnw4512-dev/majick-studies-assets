name: Aetheria release certification
on:
  pull_request:
    paths: ['current-site/**', 'tests/**', 'pages-release/current/**', '.github/workflows/**', 'playwright.config.cjs']
  push:
    branches: [main]
    paths: ['current-site/**', 'tests/**', 'pages-release/current/**', '.github/workflows/**', 'playwright.config.cjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aetheria-certification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical regression suites
        run: |
          set -euo pipefail
          node pages-release/current/release-checks.cjs current-site
          for suite in pages-release/current/test-*.cjs; do node "$suite" current-site; done
          node --test tests/d756-question-classification.test.cjs
          node --test current-site/pixi-sanctuary/guardian-animation-controller.test.cjs
          node --test current-site/tests/learning-observatory.test.cjs
      - name: Verify source manifest, protected motion and complete build
        run: python pages-release/current/build.py current-site _site
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [interactions, sanctuary, commons-390, commons-820, commons-1366, probability, shared-repair, immersion, meeting, observatory, alchemy, regressions]
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      MIGRATION_URL: http://127.0.0.1:8765
      MAJICK_URL: http://127.0.0.1:8765/
      AETHERIA_BASE_URL: http://127.0.0.1:8765/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test clients
        run: |
          python -m pip install playwright==1.56.0
          npm install --no-save @playwright/test
      - name: Build the exact candidate
        run: python pages-release/current/build.py current-site _site
      - name: Exercise complete browser journeys
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory _site > /tmp/aetheria-release-server.log 2>&1 &
          case "$SUITE" in
            interactions) node pages-release/current/browser-interactions.cjs _site ;;
            sanctuary) node pages-release/current/browser-sanctuary.cjs _site; python -u tests/aetheria-sanctuary-browser.py _site ;;
            commons-*) COMMONS_WIDTH="${SUITE#commons-}" node pages-release/current/browser-commons.cjs _site ;;
            probability) node pages-release/current/browser-probability.cjs _site ;;
            shared-repair) node pages-release/current/browser-shared-repair.cjs _site ;;
            immersion) node pages-release/current/browser-immersion.cjs _site ;;
            meeting)
              python -u tests/d756-meeting-browser.py
              python -u tests/d756-responsive-writing-browser.py
              python -u tests/d756-ux-browser.py
              python -u tests/d756-full-script-browser.py
              python -u tests/d756-scenario-library-browser.py
              python -u tests/d756-short-meetings-browser.py ;;
            observatory) python -u current-site/tests/learning_observatory_browser.py ;;
            alchemy) python -u tests/aetheria-alchemy-browser.py _site ;;
            regressions) npx playwright test tests/integration-regression.spec.cjs tests/runtime-migration.spec.cjs tests/council-lifecycle.spec.cjs tests/reward-journal.spec.cjs tests/save-safety-browser.spec.cjs --workers 1 --reporter list ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certification-${{ matrix.suite }}
          path: |
            test-results/
            work/
            /tmp/aetheria-release-server.log
          if-no-files-found: ignore
