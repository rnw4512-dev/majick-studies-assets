name: Aetheria rebuild foundation checks
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/aetheria-next-check.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/aetheria-next-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    # Pinned: ubuntu-latest (26.04) is not supported by Playwright 1.56.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci
      - name: Typecheck, unit test and build
        run: |
          npm run check
          npm test
          npm run build
      - name: Test responsive shell
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
