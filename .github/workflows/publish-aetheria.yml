name: Publish Aetheria to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'current-site/**'
      - 'pages-release/current/**'
      - 'tests/**'
      - 'index.html'
      - '.nojekyll'
      - '.github/workflows/publish-aetheria.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site content
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit release manifest before running expensive tests
        run: python pages-release/current/review_manifest.py
      - name: Verify canonical source, learning and saves using the shared release gate
        run: python pages-release/current/validate_release.py current-site _certified
      - name: Install browser runner
        run: python -m pip install playwright==1.56.0
      - name: Verify real learning, Journal, Council and Guardian flows before publishing
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          RECOVERY_EVIDENCE: /tmp/aetheria-sanctuary-evidence
        run: |
          python -u tests/startup-learning-browser.py _certified
          python -u tests/room-navigation-browser.py _certified
          python -u tests/d669-content-browser.py _certified
          python -u tests/approved-assets-browser.py _certified
          python -u tests/room-interactions-browser.py _certified
          python -u tests/aetheria-sanctuary-browser.py _certified
          python -m http.server 8765 --directory _certified > /tmp/aetheria-pages-test-server.log 2>&1 &
          python -u tests/d756-full-script-browser.py
          python -u tests/d756-scenario-library-browser.py
          python -u tests/d756-meeting-browser.py
          python -u tests/d756-ux-browser.py
      - name: Preserve browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetheria-pages-browser-evidence
          path: |
            /tmp/aetheria-sanctuary-evidence
            /tmp/aetheria-learning-evidence
            /tmp/aetheria-pages-test-server.log
          if-no-files-found: ignore
      - name: Verify app entry point and meeting assets
        run: |
          test -s current-site/index.html
          test -s current-site/d756-task2-meeting.js
          test -s current-site/iep-meeting-pixi-scene.js
          for role in parent student lea teacher; do test -s "current-site/assets/iep-council/$role.svg"; done
      - name: Preserve canonical /current-site/ route
        run: |
          mkdir -p _aetheria_pages/current-site
          cp -a _certified/. _aetheria_pages/current-site/
          cp _certified/release.json _aetheria_pages/release.json
          python - <<'PYCOMMIT'
          import json,os
          from pathlib import Path
          Path('_aetheria_pages/current-site/deployment.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA']}))
          PYCOMMIT
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./current-site/"><title>Aetheria</title><a href="./current-site/">Open Aetheria</a></html>' > _aetheria_pages/index.html
          touch _aetheria_pages/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _aetheria_pages
      - name: Wait for the uploaded Pages artifact to become discoverable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"
            if [ "$artifact" = "1" ]; then
              echo 'The uploaded Pages artifact is discoverable.'
              exit 0
            fi
            echo "Waiting for Pages artifact metadata (${attempt}/20)."
            sleep 3
          done
          echo '::error::Uploaded Pages artifact did not become discoverable; refusing deployment.'
          exit 1
      - name: Reject superseded main builds before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$latest" = "$GITHUB_SHA" || { echo 'A newer main commit supersedes this build; refusing deployment.'; exit 1; }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm live Pages routes return HTTP 200
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Published Pages URL: ${PAGES_URL}"
          for path in "" "current-site/" "current-site/index.html"; do
            url="${PAGES_URL%/}/${path}"
            status="000"
            for attempt in 1 2 3 4 5 6 7 8; do
              status="$(curl --location --silent --show-error --output /dev/null --max-time 20 --write-out '%{http_code}' --header 'Cache-Control: no-cache' "${url}?release=${GITHUB_SHA}" || true)"
              echo "GET ${url} HTTP ${status} attempt ${attempt}/8"
              if [[ "${status}" == "200" ]]; then break; fi
              sleep 8
            done
            if [[ "${status}" != "200" ]]; then
              echo "::error::Public GitHub Pages URL did not respond with HTTP 200: ${url} (got ${status}). Check Settings → Pages, source GitHub Actions, and published artifact."
              exit 1
            fi
          done
          echo "Public root and current-site entry points verified."

      - name: Verify the exact deployed source and release
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PYVERIFY'
          import json,os,time,urllib.request
          from pathlib import Path
          base=os.environ['PAGES_URL'].rstrip('/')+'/'
          expected=json.loads(Path('_certified/release.json').read_text())
          for attempt in range(30):
              try:
                  def read(path):
                      with urllib.request.urlopen(base+path+'?verify='+str(time.time()),timeout=20) as response:
                          return response.read().decode()
                  assert json.loads(read('current-site/deployment.json'))['commit']==os.environ['GITHUB_SHA']
                  assert json.loads(read('current-site/release.json'))==expected
                  assert expected['build'] in read('current-site/index.html')
                  print('Verified exact live commit:',os.environ['GITHUB_SHA'],'release:',expected['build'])
                  break
              except Exception as error:
                  print('Waiting for exact Pages release:',error)
                  time.sleep(5)
          else:
              raise SystemExit('Exact production commit was not verified')
          PYVERIFY

      - name: Verify production learning and room navigation
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          MAJICK_URL: ${{ steps.deployment.outputs.page_url }}current-site/
        run: |
          python -u tests/startup-learning-browser.py _certified
          python -u tests/room-navigation-browser.py _certified
          python -u tests/d669-content-browser.py _certified
          python -u tests/approved-assets-browser.py _certified
          python -u tests/room-interactions-browser.py _certified
