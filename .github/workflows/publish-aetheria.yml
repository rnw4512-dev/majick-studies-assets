name: Publish Aetheria to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'current-site/**'
      - 'index.html'
      - '.nojekyll'
      - '.github/workflows/publish-aetheria.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site content
        uses: actions/checkout@v4
      - name: Verify app entry point and meeting assets
        run: |
          test -s current-site/index.html
          test -s current-site/d756-task2-meeting.js
          test -s current-site/iep-meeting-pixi-scene.js
          for role in parent student lea teacher; do test -s "current-site/assets/iep-council/$role.svg"; done
      - name: Preserve canonical /current-site/ route
        run: |
          mkdir -p _aetheria_pages/current-site
          cp -a current-site/. _aetheria_pages/current-site/
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./current-site/"><title>Aetheria</title><a href="./current-site/">Open Aetheria</a></html>' > _aetheria_pages/index.html
          touch _aetheria_pages/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _aetheria_pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
