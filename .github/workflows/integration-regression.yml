name: Majick integration regression
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - current-site/**
      - tests/**
      - pages-release/current/**
      - .github/workflows/integration-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical source and current save compatibility
        run: |
          node pages-release/current/release-checks.cjs current-site
          python pages-release/current/build.py current-site _site
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python browser runner
        run: python -m pip install playwright==1.56.0
      - name: Verify startup isolation and durable question state
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: python -u tests/startup-learning-browser.py _site
      - name: Check JavaScript syntax
        run: |
          node --check current-site/pixi-sanctuary/prototype.js
          node --check current-site/verified-milestone-ceremony.js
          node --check current-site/scholar-wardrobe-studio.js
      - name: Run browser regression
        run: |
          python3 -m http.server 8765 --directory current-site >/tmp/majick-server.log 2>&1 &
          MIGRATION_URL=http://127.0.0.1:8765 npx playwright test tests/integration-regression.spec.cjs tests/council-lifecycle.spec.cjs --browser chromium --workers 1 --reporter list
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: majick-integration-results
          path: |
            test-results/
            /tmp/majick-server.log
          if-no-files-found: ignore
