name: Aetheria alchemy acceptance
on:
  pull_request:
    paths: ['current-site/**', 'tests/aetheria-alchemy-browser.py', '.github/workflows/aetheria-alchemy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alchemy-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.56.0
      - run: python pages-release/current/build.py current-site _site
      - name: Five recipes, effects, fragments, eggs, real save and recovery at three widths
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          RECOVERY_EVIDENCE: alchemy-evidence
        run: python -u tests/aetheria-alchemy-browser.py _site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alchemy-browser-evidence
          path: alchemy-evidence
