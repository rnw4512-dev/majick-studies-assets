name: Deploy Majick Studies to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages-release/majick-pages-site.zip'
      - 'pages-release/v339-patch.b64.part*'
      - 'pages-release/v3310/**'
      - 'pages-release/v3311/**'
      - 'pages-release/v3312/**'
      - 'pages-release/v3313/**'
      - 'pages-release/v3314/**'
      - 'pages-release/v3315/**'
      - 'pages-release/v3316/**'
      - 'pages-release/v3317/**'
      - 'pages-release/stability-reset/**'
      - 'sanctuary/assets/objects/**'
      - 'sanctuary/assets/evolutions/**'
      - 'sanctuary/assets/majick-v3317-evolution-repair-small.zip'
      - 'sanctuary/assets/majick-v3317-evolution-final-clean.zip'
      - 'sanctuary/assets/majick-v3315-art-sync.zip'
      - '.github/workflows/deploy-majick-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: majick-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Majick Studies sources
        shell: bash
        run: |
          set -euo pipefail
          test -s pages-release/majick-pages-site.zip
          for n in 01 02 03 04 05; do test -s "pages-release/v339-patch.b64.part$n"; done
          test -s pages-release/v3310/v3310-main.js
          test -s pages-release/v3310/v3310-main.css
          test -s pages-release/v3310/v3310-sanctuary.js
          test -s pages-release/v3310/v3310-apply.py
          test -s pages-release/v3311/v3311-main.js
          test -s pages-release/v3311/v3311-main.css
          test -s pages-release/v3311/v3311-plus.js
          test -s pages-release/v3311/v3311-plus.css
          test -s pages-release/v3311/v3311-sanctuary.js
          test -s pages-release/v3311/v3311-apply.py
          test -s pages-release/v3312/v3312-main.js
          test -s pages-release/v3312/v3312-main.css
          test -s pages-release/v3312/v3312-sanctuary.js
          test -s pages-release/v3312/v3312-apply.py
          test -s pages-release/v3313/v3313-main.js
          test -s pages-release/v3313/v3313-main.css
          test -s pages-release/v3313/v3313-sanctuary.js
          test -s pages-release/v3313/v3313-apply.py
          test -s pages-release/v3314/v3314-main.js
          test -s pages-release/v3314/v3314-main.css
          test -s pages-release/v3314/v3314-sanctuary.js
          test -s pages-release/v3314/v3314-apply.py
          test -s pages-release/v3315/v3315-main.js
          test -s pages-release/v3315/v3315-main.css
          test -s pages-release/v3315/v3315-sanctuary.js
          test -s pages-release/v3315/v3315-apply.py
          test -s pages-release/v3315/study-material/materialParser.js
          test -s pages-release/v3315/study-material/materialStoreModel.js
          test -s pages-release/v3315/study-material/questionBuilder.js
          test -s pages-release/v3315/study-material/AddStudyMaterialPage.js
          test -s sanctuary/assets/evolutions/evolution-manifest.json
          test -s sanctuary/assets/evolutions/normalize-evolution-art.py
          test -s sanctuary/assets/majick-v3317-evolution-repair-small.zip
          test -s pages-release/v3316/courseManager.js
          test -s pages-release/v3316/v3316-main.js
          test -s pages-release/v3316/v3316-main.css
          test -s pages-release/v3316/v3316-apply.py
          test -s pages-release/v3317/v3317-sanctuary.js
          test -s pages-release/v3317/v3317-main.js
          test -s pages-release/v3317/guardian-care-economy.js
          test -s pages-release/v3317/guardian-care-economy.css
          test -s pages-release/v3317/v3317-apply.py
          test -s pages-release/v3317/refresh-v3317.html
          test -s pages-release/v3317/v3317-clean-sanitize.py
          test -s pages-release/v3317/v3317-optimize-phaser.py
          test -s pages-release/v3317/v3317-verify-release.py
          test -s pages-release/v3317/v3317-migration-smoke.js
          test -s pages-release/stability-reset/guardian-registry.js
          test -s pages-release/stability-reset/majick-state-core.js
          test -s pages-release/stability-reset/stability-reset-build.py
          test -s pages-release/stability-reset/stability-reset-verify.py
          test -s pages-release/v3316/enlarge-approved-stage-art.py
          test -s sanctuary/assets/objects/objects-manifest.json
          test -s sanctuary/assets/objects/generate-object-library.py
          python -m py_compile pages-release/v3317/v3317-apply.py
          python -m py_compile pages-release/stability-reset/stability-reset-build.py
          python -m py_compile pages-release/stability-reset/stability-reset-verify.py
          python -m py_compile pages-release/v3317/v3317-optimize-phaser.py
          python -m py_compile pages-release/v3317/v3317-verify-release.py
          python -m py_compile sanctuary/assets/objects/generate-object-library.py
          node --check pages-release/v3317/v3317-main.js
          node --check pages-release/v3317/v3317-sanctuary.js
          node --check pages-release/v3317/guardian-care-economy.js
          node --check pages-release/stability-reset/guardian-registry.js
          node --check pages-release/stability-reset/majick-state-core.js
          node --check pages-release/v3317/v3317-migration-smoke.js
          node pages-release/v3317/v3317-migration-smoke.js

      - name: Assemble Majick Studies V3.3.18 Stability Reset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site _patch339 /tmp/v339-patch.zip /tmp/v339-patch.b64
          mkdir -p _site _patch339

          # Stable website base.
          unzip -oq pages-release/majick-pages-site.zip -d _site

          # Reapply V3.3.9.
          cat pages-release/v339-patch.b64.part01 \
              pages-release/v339-patch.b64.part02 \
              pages-release/v339-patch.b64.part03 \
              pages-release/v339-patch.b64.part04 \
              pages-release/v339-patch.b64.part05 \
              | tr -d '\r\n' > /tmp/v339-patch.b64
          base64 --decode /tmp/v339-patch.b64 > /tmp/v339-patch.zip
          unzip -t /tmp/v339-patch.zip
          unzip -oq /tmp/v339-patch.zip -d _patch339
          python _patch339/apply_patch.py _site

          # Reapply the confirmed-working V3.3.10 motion-restore layer.
          cp pages-release/v3310/v3310-main.js _site/v3310-main.js
          cp pages-release/v3310/v3310-main.css _site/v3310-main.css
          cp pages-release/v3310/v3310-sanctuary.js _site/sanctuary/v3310-sanctuary.js
          python pages-release/v3310/v3310-apply.py _site

          # V3.3.11 works around the protected Phaser movers.
          cp pages-release/v3311/v3311-main.js _site/v3311-main.js
          cp pages-release/v3311/v3311-main.css _site/v3311-main.css
          cp pages-release/v3311/v3311-plus.js _site/v3311-plus.js
          cp pages-release/v3311/v3311-plus.css _site/v3311-plus.css
          cp pages-release/v3311/v3311-sanctuary.js _site/sanctuary/v3311-sanctuary.js
          python -m pip install --quiet pillow
          python pages-release/v3311/v3311-apply.py _site

          # V3.3.12 fixes level-aware evolution visuals and moves heavy art to on-demand loading.
          cp pages-release/v3312/v3312-main.js _site/v3312-main.js
          cp pages-release/v3312/v3312-main.css _site/v3312-main.css
          cp pages-release/v3312/v3312-sanctuary.js _site/sanctuary/v3312-sanctuary.js
          python pages-release/v3312/v3312-apply.py _site

          # V3.3.13 restores the real Phaser sanctuary and wires optional final object art.
          cp pages-release/v3313/v3313-main.js _site/v3313-main.js
          cp pages-release/v3313/v3313-main.css _site/v3313-main.css
          cp pages-release/v3313/v3313-sanctuary.js _site/sanctuary/v3313-sanctuary.js
          python pages-release/v3313/v3313-apply.py _site

          # V3.3.14 makes every Sanctuary view use the same Phaser world and moves objects/evolution visuals to data-driven layers.
          cp pages-release/v3314/v3314-main.js _site/v3314-main.js
          cp pages-release/v3314/v3314-main.css _site/v3314-main.css
          cp pages-release/v3314/v3314-sanctuary.js _site/sanctuary/v3314-sanctuary.js
          mkdir -p _site/sanctuary/assets/objects
          cp sanctuary/assets/objects/objects-manifest.json _site/sanctuary/assets/objects/objects-manifest.json
          python pages-release/v3314/v3314-apply.py _site

          # Optional single-file furniture sync bundle.
          # The old generated evolution-action sheets are intentionally ignored.
          if [ -s sanctuary/assets/majick-v3315-art-sync.zip ]; then
            rm -rf /tmp/majick-v3315-art-sync
            mkdir -p /tmp/majick-v3315-art-sync
            unzip -oq sanctuary/assets/majick-v3315-art-sync.zip -d /tmp/majick-v3315-art-sync
            test -d /tmp/majick-v3315-art-sync/sanctuary/assets/objects
            cp -a /tmp/majick-v3315-art-sync/sanctuary/assets/objects/. sanctuary/assets/objects/
          fi

          # V3.3.17 individual Guardian evolution assets.
          # Prefer the final-clean bundle when present; keep the earlier repair bundle only as fallback.
          rm -rf /tmp/majick-v3317-evolution-repair
          mkdir -p /tmp/majick-v3317-evolution-repair
          if [ -s sanctuary/assets/majick-v3317-evolution-final-clean.zip ]; then
            unzip -oq sanctuary/assets/majick-v3317-evolution-final-clean.zip -d /tmp/majick-v3317-evolution-repair
            echo "Using FINAL CLEAN Guardian evolution bundle"
          else
            unzip -oq sanctuary/assets/majick-v3317-evolution-repair-small.zip -d /tmp/majick-v3317-evolution-repair
            echo "Using fallback Guardian evolution repair bundle"
          fi
          test -d /tmp/majick-v3317-evolution-repair/sanctuary/assets/evolutions
          cp -a /tmp/majick-v3317-evolution-repair/sanctuary/assets/evolutions/. sanctuary/assets/evolutions/

          # V3.3.15 adds Notes Forge and one shared Guardian stage resolver.
          cp pages-release/v3315/v3315-main.js _site/v3315-main.js
          cp pages-release/v3315/v3315-main.css _site/v3315-main.css
          cp pages-release/v3315/v3315-sanctuary.js _site/sanctuary/v3315-sanctuary.js
          mkdir -p _site/study-material
          cp pages-release/v3315/study-material/materialParser.js _site/study-material/materialParser.js
          cp pages-release/v3315/study-material/materialStoreModel.js _site/study-material/materialStoreModel.js
          cp pages-release/v3315/study-material/questionBuilder.js _site/study-material/questionBuilder.js
          cp pages-release/v3315/study-material/AddStudyMaterialPage.js _site/study-material/AddStudyMaterialPage.js
          mkdir -p _site/sanctuary/assets/evolutions
          cp -a sanctuary/assets/evolutions/. _site/sanctuary/assets/evolutions/
          python pages-release/v3315/v3315-apply.py _site

          # V3.3.16 separates academic course state from learner-level experience and repairs Guardian presentation.
          cp pages-release/v3316/courseManager.js _site/courseManager.js
          cp pages-release/v3316/v3316-main.js _site/v3316-main.js
          cp pages-release/v3316/v3316-main.css _site/v3316-main.css
          python pages-release/v3316/v3316-apply.py _site
          python pages-release/v3316/enlarge-approved-stage-art.py _site/assets/familiars/evolution_stages
          cp pages-release/v3317/v3317-sanctuary.js _site/sanctuary/v3317-sanctuary.js
          cp pages-release/v3317/v3317-main.js _site/v3317-main.js
          cp pages-release/v3317/guardian-care-economy.js _site/guardian-care-economy.js
          cp pages-release/v3317/guardian-care-economy.css _site/guardian-care-economy.css
          cp pages-release/stability-reset/guardian-registry.js _site/guardian-registry.js
          cp pages-release/stability-reset/majick-state-core.js _site/majick-state-core.js
          python pages-release/v3317/v3317-apply.py _site
          cp pages-release/v3317/refresh-v3317.html _site/refresh-v3317.html
          python -c "from pathlib import Path; p=Path('_site/sanctuary/index.html'); s=p.read_text(); tag='<script src=\"./v3317-sanctuary.js?v=3317\"></script>'; s=s if tag in s else s.replace('</body>',tag+'\\n</body>',1); p.write_text(s)"

          # STABILITY RESET: historical releases are compile-time inputs only.
          # Publish one registry/state/care/runtime chain without rewriting JS bodies.
          python pages-release/stability-reset/stability-reset-build.py _site

          # HARD RULE: copy the original Phase 4 images byte-for-byte; never regenerate them.
          mkdir -p _site/sanctuary/assets/motion
          cp luna-idle.png _site/sanctuary/assets/motion/luna-idle.png
          cp luna-walk-1.png _site/sanctuary/assets/motion/luna-walk-1.png
          cp luna-walk-2.png _site/sanctuary/assets/motion/luna-walk-2.png
          cp luna-hop.png _site/sanctuary/assets/motion/luna-hop.png

          cp ember-idle.png _site/sanctuary/assets/motion/ember-idle.png
          cp ember-walk-1.png _site/sanctuary/assets/motion/ember-walk-1.png
          cp ember-walk-2.png _site/sanctuary/assets/motion/ember-walk-2.png
          cp ember-hop.png _site/sanctuary/assets/motion/ember-hop.png
          cp ember-slither-1.png _site/sanctuary/assets/motion/ember-slither-1.png
          cp ember-slither-2.png _site/sanctuary/assets/motion/ember-slither-2.png
          cp ember-sit.png _site/sanctuary/assets/motion/ember-sit.png
          cp ember-sleep.png _site/sanctuary/assets/motion/ember-sleep.png

          cp nova-walk-1.png _site/sanctuary/assets/motion/nova-walk-1.png
          cp nova-walk-2.png _site/sanctuary/assets/motion/nova-walk-2.png
          cp nova-run.png _site/sanctuary/assets/motion/nova-run.png
          cp nova-hop.png _site/sanctuary/assets/motion/nova-hop.png
          cp nova-paw.png _site/sanctuary/assets/motion/nova-paw.png
          cp nova-spin.png _site/sanctuary/assets/motion/nova-spin.png
          cp nova-sit.png _site/sanctuary/assets/motion/nova-sit.png
          cp nova-sleep.png _site/sanctuary/assets/motion/nova-sleep.png
          cp nova-pounce.png _site/sanctuary/assets/motion/nova-pounce.png
          cp nova-pounce2.png _site/sanctuary/assets/motion/nova-pounce2.png
          cp nova-pounce3.png _site/sanctuary/assets/motion/nova-pounce3.png

          cp mallow-idle.png _site/sanctuary/assets/motion/mallow-idle.png
          cp mallow-hop-1.png _site/sanctuary/assets/motion/mallow-hop-1.png
          cp mallow-hop-2.png _site/sanctuary/assets/motion/mallow-hop-2.png
          cp "mallow-fly 1.png" _site/sanctuary/assets/motion/mallow-fly-1.png
          cp "mallow-fly 2.png" _site/sanctuary/assets/motion/mallow-fly-2.png
          cp mallow-paw.png _site/sanctuary/assets/motion/mallow-paw.png
          cp mallow-sit.png _site/sanctuary/assets/motion/mallow-sit.png
          cp mallow-sleep.png _site/sanctuary/assets/motion/mallow-sleep.png
          cp mallow-land.png _site/sanctuary/assets/motion/mallow-land.png
          cp mallow-binky.png _site/sanctuary/assets/motion/mallow-binky.png

          # Full manifest object library. Generate starter WebPs only when a final replacement file is not present.
          python sanctuary/assets/objects/generate-object-library.py sanctuary/assets/objects
          mkdir -p _site/sanctuary/assets/objects
          cp -a sanctuary/assets/objects/. _site/sanctuary/assets/objects/

          # PERFORMANCE HOTFIX: do not decode the 33 protected 1254px PNGs at startup.
          # Keep originals untouched and generate smaller runtime-only WebP copies.
          python pages-release/v3317/v3317-optimize-phaser.py _site

          touch _site/.nojekyll

          # Gate deployment on protected movement plus current V3.3.17 requirements.
          test -s _site/index.html
          test -s _site/v3311-main.js
          test -s _site/v3311-plus.js
          test -s _site/v3311-main.css
          test -s _site/v3311-plus.css
          test -s _site/sanctuary/assets/motion/luna-walk-1.png
          test -s _site/sanctuary/assets/motion/ember-slither-1.png
          test -s _site/sanctuary/assets/motion/nova-run.png
          test -s _site/sanctuary/assets/motion/mallow-fly-1.png
          test "$(find _site/assets/familiars/evolution_stages -type f -name '*.webp' | wc -l)" -eq 50
          test -s _site/assets/familiars/evolution_stages/velora-new-bond.webp
          test -s _site/assets/familiars/evolution_stages/velora-ascendant.webp
          test -s _site/assets/familiars/evolution_stages/solara-celestial.webp
          test -s _site/v3312-main.js
          test -s _site/v3312-main.css
          test -s _site/v3313-main.css
          grep -q "obj-arcane-stacks" _site/sanctuary/Preloader.js
          test -s _site/v3314-main.css
          test -s _site/sanctuary/assets/objects/objects-manifest.json
          test -s _site/v3315-main.css
          test -s _site/sanctuary/assets/evolutions/evolution-manifest.json
          if [ -s sanctuary/assets/majick-v3315-art-sync.zip ]; then
            test -s _site/sanctuary/assets/objects/magic-mirror.webp
            test -s _site/sanctuary/assets/objects/moonlit-study-desk.webp
            test -s _site/sanctuary/assets/objects/celestial-telescope.webp
            test -s _site/sanctuary/assets/objects/enchanted-bookstack.webp
            test -s _site/sanctuary/assets/objects/moonstone-canopy-bed.webp
          fi
          python -c "from PIL import Image; from pathlib import Path; root=Path('_site/assets/familiars/evolution_stages'); paths=[root/f'{n}-{s}.webp' for n in ('velora','cascade','solstice','aurelia') for s in ('new-bond','apprentice','guardian','ascendant','celestial')]; [(_ for _ in ()).throw(AssertionError(f'{p} missing')) for p in paths if not p.exists()]; [(_ for _ in ()).throw(AssertionError(f'{p} size {Image.open(p).size}')) for p in paths if Image.open(p).size!=(640,1000)]; print('Approved Guardian portraits verified at 640x1000')"
          test -s _site/study-material/materialParser.js
          test -s _site/study-material/materialStoreModel.js
          test -s _site/study-material/questionBuilder.js
          test -s _site/study-material/AddStudyMaterialPage.js
          grep -q "majick-evolution-manifest" _site/sanctuary/Preloader.js
          grep -q "Add Study Material" _site/study-material/AddStudyMaterialPage.js
          node --check _site/study-material/materialParser.js
          node --check _site/study-material/materialStoreModel.js
          node --check _site/study-material/questionBuilder.js
          node --check _site/study-material/AddStudyMaterialPage.js
          test "$(find _site/sanctuary/assets/objects -type f -name '*.webp' | wc -l)" -ge 9
          test "$(find _site/sanctuary/assets/motion -type f -name '*.png' | wc -l)" -eq 33
          test "$(find _site/sanctuary/assets/runtime-motion -type f -name '*.webp' | wc -l)" -eq 33
          test "$(find _site/sanctuary/assets/runtime-objects -type f -name '*.webp' | wc -l)" -ge 15
          grep -q "assets/runtime-motion/" _site/sanctuary/Preloader.js
          grep -q "assets/runtime-objects/" _site/sanctuary/Preloader.js
          python -c "from pathlib import Path; n=sum(p.stat().st_size for p in Path('_site/sanctuary/assets/runtime-motion').glob('*.webp')); print('runtime motion bytes',n); assert n < 4*1024*1024"
          test -s _site/courseManager.js
          test -s _site/v3316-main.css
          grep -q "PASS_XP=500" _site/courseManager.js
          node --check _site/courseManager.js
          test -s _site/sanctuary/v3317-sanctuary.js
          test -s _site/v3317-main.js
          test -s _site/refresh-v3317.html
          grep -q "v3310-sanctuary.js" _site/sanctuary/index.html
          grep -q "guardian-registry.js?v=stability-1" _site/sanctuary/index.html
          grep -q "v3317-sanctuary.js?v=stability-1" _site/sanctuary/index.html
          grep -q "guardian-registry.js?v=stability-1" _site/index.html
          grep -q "majick-state-core.js?v=stability-1" _site/index.html
          grep -q "guardian-care-economy.js?v=stability-1" _site/index.html
          grep -q "v3317-main.js?v=stability-1" _site/index.html
          for old in v3311-sanctuary.js v3312-sanctuary.js v3313-sanctuary.js v3314-sanctuary.js v3315-sanctuary.js; do
            if grep -q "$old" _site/sanctuary/index.html; then
              echo "Old Sanctuary wrapper still loaded: $old"; exit 1
            fi
            if [ -e "_site/sanctuary/$old" ]; then
              echo "Old Sanctuary wrapper still published: $old"; exit 1
            fi
          done
          for old in v3313-main.js v3314-main.js v3315-main.js v3316-main.js; do
            if grep -q "$old" _site/index.html; then
              echo "Old main Sanctuary bridge still loaded: $old"; exit 1
            fi
          done
          grep -q "protected V3.3.10 movement + one V3.3.17 Sanctuary bridge" _site/app-progress.json
          grep -q "V3.3.18 Stability Reset" _site/app-progress.json
          grep -q "majick-studies-retired-v3317" _site/service-worker.js
          if grep -q 'navigator.serviceWorker.register("./service-worker.js")' _site/index.html; then
            echo "Old service-worker registration is still present"; exit 1
          fi
          if grep -q "Moonlit V5.2 runtime error" _site/index.html; then
            echo "Legacy global crash handler is still present"; exit 1
          fi
          grep -q "Majick V3.3.17 runtime error" _site/v3317-main.js
          node --check _site/sanctuary/v3317-sanctuary.js
          node --check _site/v3317-main.js
          test "$(find _site/sanctuary/assets/evolutions -type f -name '*.webp' | wc -l)" -ge 60
          test -s _site/sanctuary/assets/evolutions/velora/new-bond/walk.webp
          test -s _site/sanctuary/assets/evolutions/velora/ascendant/play.webp
          test -s _site/sanctuary/assets/evolutions/cascade/celestial/sleep.webp
          test -s _site/sanctuary/assets/evolutions/solstice/guardian/walk.webp
          test -s _site/sanctuary/assets/evolutions/aurelia/apprentice/play.webp
          python pages-release/stability-reset/stability-reset-verify.py _site
          echo "Verified protected motion + evolution action assets under Stability Reset"
          echo "Majick Studies V3.3.18 Stability Reset assembled successfully."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
