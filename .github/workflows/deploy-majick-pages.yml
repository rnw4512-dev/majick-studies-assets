name: Certify Majick Studies Current V3.4.2 and publish canonically
# Legacy, integrity-gated stable release workflow. Run manually for certification.
# Routine main-branch publishing is owned by publish-aetheria.yml.
on:
  workflow_dispatch:
    inputs:
      release_level:
        description: 'Development or fully certified stable release'
        required: true
        type: choice
        options: [development, stable]
        default: development
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
jobs:
  certify:
    runs-on: ubuntu-latest
    env:
      IMMERSION_QA_DIR: /tmp/majick-immersion-qa
      COMMONS_QA_DIR: /tmp/majick-commons-qa
    steps:
      - name: Checkout current app
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared canonical release validation
        run: python pages-release/current/validate_release.py current-site _site
      - name: Check lessons, games, rewards, eggs and saved reload
        run: node pages-release/current/release-checks.cjs current-site
      - name: Validate imported D772 preassessment and targeted practice
        run: node pages-release/current/test-d772-preassessment.cjs current-site
      - name: Test D772 adaptive mastery lifecycle
        run: node pages-release/current/test-d772-adaptive.cjs current-site
      - name: Verify recovery, shared rigor, mixing, hands-on tasks and milestone safety
        run: node pages-release/current/test-six-enhancements.cjs
      - name: Check D772 diagrams and no-penalty question replacement
        run: node pages-release/current/test-d772-exam-visuals.cjs
      - name: Validate Collegium Commons navigation and readability contract
        run: node pages-release/current/test-collegium-commons.cjs current-site
      - name: Verify Atelier preview recovery and stale pose safety
        run: |
          node pages-release/current/test-atelier-preview-recovery.cjs
          node pages-release/current/test-atelier-scene-isolation.cjs
      - name: Verify shared Sanctuary identity and furniture migration
        run: node pages-release/current/test-sanctuary-state.cjs current-site
      - name: Verify shared teaching, fresh evidence and magical interaction safety
        run: |
          node pages-release/current/test-shared-repair.cjs
          node pages-release/current/test-interaction-magic.cjs
          node pages-release/current/test-d772-hands-on.cjs current-site
      - name: Verify remaining current regression suites
        run: |
          node pages-release/current/test-animation-effects.cjs current-site
          node pages-release/current/test-compact-navigation.cjs current-site
          node pages-release/current/test-d772-bank-expansion.cjs current-site
          node pages-release/current/test-d772-cross-room.cjs current-site
          node pages-release/current/test-d772-exam-resume.cjs current-site
          node pages-release/current/test-d772-generated-depth.cjs current-site
          node pages-release/current/test-phase6-owner.cjs current-site
          node pages-release/current/test-practice-retry-controls.cjs current-site
      - name: Verify and publish current source only
        run: python pages-release/current/build.py current-site _site

      - name: Browser test interactive lessons, rewards, course isolation and save/reload
        if: github.event_name == 'workflow_dispatch' && inputs.release_level == 'stable'
        run: node pages-release/current/browser-interactions.cjs _site

      - name: Browser test Collegium Commons desktop tablet mobile and tab interactions
        if: github.event_name == 'workflow_dispatch' && inputs.release_level == 'stable'
        run: node pages-release/current/browser-commons.cjs _site

      - name: Browser certify Pixi roster, care, furniture and Phaser fallback
        if: github.event_name == 'workflow_dispatch' && inputs.release_level == 'stable'
        run: node pages-release/current/browser-sanctuary.cjs _site

      - name: Browser test connected probability learning and teaching mastery
        if: github.event_name == 'workflow_dispatch' && inputs.release_level == 'stable'
        run: node pages-release/current/browser-probability.cjs _site

      - name: Browser certify shared teaching and magical atmosphere
        if: github.event_name == 'workflow_dispatch' && inputs.release_level == 'stable'
        run: |
          node pages-release/current/browser-shared-repair.cjs _site
          node pages-release/current/browser-immersion.cjs _site

      - name: Preserve stable browser screenshots and contrast evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.release_level == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: stable-browser-certification
          path: |
            /tmp/majick-immersion-qa
            /tmp/majick-commons-qa
            commons-qa
          if-no-files-found: ignore

      - name: Verify rebuilt site entry point
        run: |
          test -s _site/index.html
          echo 'PASS rebuilt Majick Studies entry point exists'

  publish:
    needs: certify
    uses: ./.github/workflows/publish-aetheria.yml
    secrets: inherit
