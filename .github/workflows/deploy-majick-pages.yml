name: Deploy Majick Studies to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages-release/majick-pages-site.zip'
      - 'pages-release/v339-patch.b64.part*'
      - 'pages-release/v3310/**'
      - '.github/workflows/deploy-majick-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: majick-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Majick Studies sources
        shell: bash
        run: |
          set -euo pipefail
          test -s pages-release/majick-pages-site.zip
          for n in 01 02 03 04 05; do test -s "pages-release/v339-patch.b64.part$n"; done
          test -s pages-release/v3310/v3310-main.js
          test -s pages-release/v3310/v3310-main.css
          test -s pages-release/v3310/v3310-sanctuary.js
          test -s pages-release/v3310/v3310-apply.py

      - name: Assemble Majick Studies V3.3.10
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site _patch339 /tmp/v339-patch.zip /tmp/v339-patch.b64
          mkdir -p _site _patch339

          # Stable V3.3.8 base.
          unzip -oq pages-release/majick-pages-site.zip -d _site

          # Reapply the V3.3.9 layer that already deployed successfully.
          cat pages-release/v339-patch.b64.part01               pages-release/v339-patch.b64.part02               pages-release/v339-patch.b64.part03               pages-release/v339-patch.b64.part04               pages-release/v339-patch.b64.part05               | tr -d '\r\n' > /tmp/v339-patch.b64
          base64 --decode /tmp/v339-patch.b64 > /tmp/v339-patch.zip
          unzip -t /tmp/v339-patch.zip
          unzip -oq /tmp/v339-patch.zip -d _patch339
          python _patch339/apply_patch.py _site

          # V3.3.10 is text-only code around the original sprite art.
          cp pages-release/v3310/v3310-main.js _site/v3310-main.js
          cp pages-release/v3310/v3310-main.css _site/v3310-main.css
          cp pages-release/v3310/v3310-sanctuary.js _site/sanctuary/v3310-sanctuary.js
          python pages-release/v3310/v3310-apply.py _site

          # Preserve the hand-built Phase 4 images exactly as uploaded.
          mkdir -p _site/sanctuary/assets/motion
          cp luna-idle.png _site/sanctuary/assets/motion/luna-idle.png
          cp luna-walk-1.png _site/sanctuary/assets/motion/luna-walk-1.png
          cp luna-walk-2.png _site/sanctuary/assets/motion/luna-walk-2.png
          cp luna-hop.png _site/sanctuary/assets/motion/luna-hop.png

          cp ember-idle.png _site/sanctuary/assets/motion/ember-idle.png
          cp ember-walk-1.png _site/sanctuary/assets/motion/ember-walk-1.png
          cp ember-walk-2.png _site/sanctuary/assets/motion/ember-walk-2.png
          cp ember-hop.png _site/sanctuary/assets/motion/ember-hop.png
          cp ember-slither-1.png _site/sanctuary/assets/motion/ember-slither-1.png
          cp ember-slither-2.png _site/sanctuary/assets/motion/ember-slither-2.png
          cp ember-sit.png _site/sanctuary/assets/motion/ember-sit.png
          cp ember-sleep.png _site/sanctuary/assets/motion/ember-sleep.png

          cp nova-walk-1.png _site/sanctuary/assets/motion/nova-walk-1.png
          cp nova-walk-2.png _site/sanctuary/assets/motion/nova-walk-2.png
          cp nova-run.png _site/sanctuary/assets/motion/nova-run.png
          cp nova-hop.png _site/sanctuary/assets/motion/nova-hop.png
          cp nova-paw.png _site/sanctuary/assets/motion/nova-paw.png
          cp nova-spin.png _site/sanctuary/assets/motion/nova-spin.png
          cp nova-sit.png _site/sanctuary/assets/motion/nova-sit.png
          cp nova-sleep.png _site/sanctuary/assets/motion/nova-sleep.png
          cp nova-pounce.png _site/sanctuary/assets/motion/nova-pounce.png
          cp nova-pounce2.png _site/sanctuary/assets/motion/nova-pounce2.png
          cp nova-pounce3.png _site/sanctuary/assets/motion/nova-pounce3.png

          cp mallow-idle.png _site/sanctuary/assets/motion/mallow-idle.png
          cp mallow-hop-1.png _site/sanctuary/assets/motion/mallow-hop-1.png
          cp mallow-hop-2.png _site/sanctuary/assets/motion/mallow-hop-2.png
          cp "mallow-fly 1.png" _site/sanctuary/assets/motion/mallow-fly-1.png
          cp "mallow-fly 2.png" _site/sanctuary/assets/motion/mallow-fly-2.png
          cp mallow-paw.png _site/sanctuary/assets/motion/mallow-paw.png
          cp mallow-sit.png _site/sanctuary/assets/motion/mallow-sit.png
          cp mallow-sleep.png _site/sanctuary/assets/motion/mallow-sleep.png
          cp mallow-land.png _site/sanctuary/assets/motion/mallow-land.png
          cp mallow-binky.png _site/sanctuary/assets/motion/mallow-binky.png

          touch _site/.nojekyll

          # Fail loudly before publishing if any motion or patch dependency is missing.
          test -s _site/index.html
          test -s _site/v339-main.js
          test -s _site/v3310-main.js
          test -s _site/v3310-main.css
          test -s _site/sanctuary/Preloader.js
          test -s _site/sanctuary/v3310-sanctuary.js
          test -s _site/sanctuary/assets/motion/luna-walk-1.png
          test -s _site/sanctuary/assets/motion/ember-slither-1.png
          test -s _site/sanctuary/assets/motion/nova-run.png
          test -s _site/sanctuary/assets/motion/mallow-fly-1.png
          grep -q "V3.3.10" _site/app-progress.json
          grep -q "v3310-sanctuary.js" _site/sanctuary/index.html
          grep -q "V3.3.10" _site/v3310-main.js
          echo "Majick Studies V3.3.10 assembled successfully."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
