name: Deploy Majick Studies Golden Baseline to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages-release/stability-reset/**'
      - 'pages-release/v3319/**'
      - 'pages-release/v3320/**'
      - 'pages-release/v3321/**'
      - 'pages-release/v3322/**'
      - 'pages-release/v3324/**'
      - 'pages-release/v3325/**'
      - 'pages-release/v3326/**'
      - 'pages-release/v3327/**'
      - 'pages-release/v3333/**'
      - 'pages-release/v3315/study-material/**'
      - 'pages-release/v3316/courseManager.js'
      - 'pages-release/v3317/v3317-main.js'
      - 'pages-release/v3317/v3317-sanctuary.js'
      - 'pages-release/v3317/guardian-care-economy.js'
      - 'pages-release/v3317/guardian-care-economy.css'
      - 'pages-release/v3317/v3317-optimize-phaser.py'
      - 'pages-release/v3317/v3317-migration-smoke.js'
      - 'sanctuary/assets/objects/**'
      - 'sanctuary/assets/evolutions/**'
      - 'sanctuary/assets/majick-v3317-evolution-repair-small.zip'
      - 'sanctuary/assets/majick-v3317-evolution-final-clean.zip'
      - 'sanctuary/assets/majick-v3315-art-sync.zip'
      - 'luna-*.png'
      - 'ember-*.png'
      - 'nova-*.png'
      - 'mallow-*.png'
      - '.github/workflows/deploy-majick-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: majick-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current sources
        uses: actions/checkout@v4

      - name: Verify current Stability Reset sources
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --exit-code --heads origin refs/heads/v3318-golden-baseline >/dev/null
          test -s pages-release/stability-reset/golden-build.py
          test -s pages-release/stability-reset/stability-reset-verify.py
          test -s pages-release/stability-reset/browser-smoke.mjs
          test -s pages-release/stability-reset/stability-state-smoke.js
          test -s pages-release/stability-reset/v3310-ui-compat.js
          test -s pages-release/stability-reset/v3312-ui-compat.js
          test -s pages-release/stability-reset/guardian-registry.js
          test -s pages-release/stability-reset/majick-state-core.js
          test -s pages-release/v3319/learning-lab.js
          test -s pages-release/v3319/learning-lab.css
          test -s pages-release/v3324/learning-plan.js
          test -s pages-release/v3324/learning-plan.css
          test -s pages-release/v3326/course-tutor.js
          test -s pages-release/v3326/course-tutor.css
          test -s pages-release/v3327/magical-college-home.js
          test -s pages-release/v3327/magical-college-home.css
          test -s pages-release/v3333/wgu-practice.js
          test -s pages-release/v3333/wgu-practice.css
          test -s pages-release/v3333/wgu-practice-smoke.js
          test -s pages-release/v3320/sanctuary-life.js
          test -s pages-release/v3321/sanctuary-customize.js
          test -s pages-release/v3322/main-recovery.js
          test -s pages-release/v3322/sanctuary-recovery.js
          test -s pages-release/v3325/sanctuary-visual-authority.js
          test -s pages-release/v3315/study-material/materialParser.js
          test -s pages-release/v3315/study-material/materialStoreModel.js
          test -s pages-release/v3315/study-material/questionBuilder.js
          test -s pages-release/v3315/study-material/AddStudyMaterialPage.js
          test -s pages-release/v3316/courseManager.js
          test -s pages-release/v3317/v3317-main.js
          test -s pages-release/v3317/v3317-sanctuary.js
          test -s pages-release/v3317/guardian-care-economy.js
          test -s pages-release/v3317/guardian-care-economy.css
          test -s pages-release/v3317/v3317-optimize-phaser.py
          test -s sanctuary/assets/objects/objects-manifest.json
          test -s sanctuary/assets/objects/generate-object-library.py
          test -s sanctuary/assets/evolutions/evolution-manifest.json
          test -s sanctuary/assets/majick-v3317-evolution-repair-small.zip

          python -m py_compile pages-release/stability-reset/golden-build.py
          python -m py_compile pages-release/stability-reset/stability-reset-verify.py
          python -m py_compile pages-release/v3317/v3317-optimize-phaser.py
          python -m py_compile sanctuary/assets/objects/generate-object-library.py

          node --check pages-release/stability-reset/v3310-ui-compat.js
          node --check pages-release/stability-reset/v3312-ui-compat.js
          node --check pages-release/stability-reset/guardian-registry.js
          node --check pages-release/stability-reset/majick-state-core.js
          node --check pages-release/v3319/learning-lab.js
          node --check pages-release/v3324/learning-plan.js
          node --check pages-release/v3326/course-tutor.js
          node --check pages-release/v3327/magical-college-home.js
          node --check pages-release/v3333/wgu-practice.js
          node --check pages-release/v3320/sanctuary-life.js
          node --check pages-release/v3321/sanctuary-customize.js
          node --check pages-release/v3322/main-recovery.js
          node --check pages-release/v3322/sanctuary-recovery.js
          node --check pages-release/v3325/sanctuary-visual-authority.js
          node --check pages-release/v3317/v3317-main.js
          node --check pages-release/v3317/v3317-sanctuary.js
          node --check pages-release/v3317/guardian-care-economy.js
          node --check pages-release/v3315/study-material/materialParser.js
          node --check pages-release/v3315/study-material/materialStoreModel.js
          node --check pages-release/v3315/study-material/questionBuilder.js
          node --check pages-release/v3315/study-material/AddStudyMaterialPage.js
          node --check pages-release/v3316/courseManager.js
          node --check pages-release/stability-reset/stability-state-smoke.js
          node --check pages-release/stability-reset/browser-smoke.mjs

          node pages-release/v3317/v3317-migration-smoke.js
          node pages-release/stability-reset/stability-state-smoke.js

      - name: Fetch immutable V3.3.18 Golden Baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/majick-golden.zip /tmp/majick-golden-manifest.json /tmp/majick-golden-files.sha256
          git fetch --no-tags --depth=1 origin refs/heads/v3318-golden-baseline
          git show FETCH_HEAD:majick-v3318-golden-baseline.zip > /tmp/majick-golden.zip
          git show FETCH_HEAD:manifest.json > /tmp/majick-golden-manifest.json
          git show FETCH_HEAD:FILES.sha256 > /tmp/majick-golden-files.sha256
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          z=Path('/tmp/majick-golden.zip')
          m=json.loads(Path('/tmp/majick-golden-manifest.json').read_text())
          h=hashlib.sha256(z.read_bytes()).hexdigest()
          assert m['runtime_version']=='3.3.18-stability'
          assert h==m['golden_zip_sha256'], (h,m['golden_zip_sha256'])
          assert m['file_count']>=200
          print('Golden Baseline archive verified:',h)
          PY

      - name: Assemble from Golden Baseline
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow

          python pages-release/stability-reset/golden-build.py             "$PWD" "$PWD/_site"             /tmp/majick-golden.zip             /tmp/majick-golden-manifest.json             /tmp/majick-golden-files.sha256

          # Refresh current evolution assets directly into the site. Never mutate source folders.
          rm -rf /tmp/majick-evolution-overlay
          mkdir -p /tmp/majick-evolution-overlay
          if [ -s sanctuary/assets/majick-v3317-evolution-final-clean.zip ]; then
            unzip -oq sanctuary/assets/majick-v3317-evolution-final-clean.zip -d /tmp/majick-evolution-overlay
          else
            unzip -oq sanctuary/assets/majick-v3317-evolution-repair-small.zip -d /tmp/majick-evolution-overlay
          fi
          test -d /tmp/majick-evolution-overlay/sanctuary/assets/evolutions
          mkdir -p _site/sanctuary/assets/evolutions
          cp -a /tmp/majick-evolution-overlay/sanctuary/assets/evolutions/. _site/sanctuary/assets/evolutions/
          cp sanctuary/assets/evolutions/evolution-manifest.json _site/sanctuary/assets/evolutions/evolution-manifest.json

          # Build current furniture/object assets in temp, not in the repository checkout.
          rm -rf /tmp/majick-objects /tmp/majick-art-sync
          mkdir -p /tmp/majick-objects
          cp -a sanctuary/assets/objects/. /tmp/majick-objects/
          if [ -s sanctuary/assets/majick-v3315-art-sync.zip ]; then
            mkdir -p /tmp/majick-art-sync
            unzip -oq sanctuary/assets/majick-v3315-art-sync.zip -d /tmp/majick-art-sync
            if [ -d /tmp/majick-art-sync/sanctuary/assets/objects ]; then
              cp -a /tmp/majick-art-sync/sanctuary/assets/objects/. /tmp/majick-objects/
            fi
          fi
          python sanctuary/assets/objects/generate-object-library.py /tmp/majick-objects
          rm -rf _site/sanctuary/assets/objects
          mkdir -p _site/sanctuary/assets/objects
          cp -a /tmp/majick-objects/. _site/sanctuary/assets/objects/

          # Derived runtime assets only. Original 33 PNGs were already hash-pinned and copied byte-for-byte.
          python pages-release/v3317/v3317-optimize-phaser.py _site
          touch _site/.nojekyll

          # Current source overlays must be exact.
          cmp pages-release/stability-reset/guardian-registry.js _site/guardian-registry.js
          cmp pages-release/stability-reset/majick-state-core.js _site/majick-state-core.js
          cmp pages-release/v3319/learning-lab.js _site/learning-lab.js
          cmp pages-release/v3319/learning-lab.css _site/learning-lab.css
          cmp pages-release/v3324/learning-plan.js _site/learning-plan.js
          cmp pages-release/v3324/learning-plan.css _site/learning-plan.css
          cmp pages-release/v3326/course-tutor.js _site/course-tutor.js
          cmp pages-release/v3326/course-tutor.css _site/course-tutor.css
          cmp pages-release/v3327/magical-college-home.js _site/magical-college-home.js
          cmp pages-release/v3327/magical-college-home.css _site/magical-college-home.css
          cmp pages-release/v3333/wgu-practice.js _site/wgu-practice.js
          cmp pages-release/v3333/wgu-practice.css _site/wgu-practice.css
          cmp pages-release/v3316/courseManager.js _site/courseManager.js
          cmp pages-release/v3317/v3317-main.js _site/v3317-main.js
          cmp pages-release/v3317/v3317-sanctuary.js _site/sanctuary/v3317-sanctuary.js
          cmp pages-release/v3320/sanctuary-life.js _site/sanctuary/v3320-sanctuary-life.js
          cmp pages-release/v3321/sanctuary-customize.js _site/sanctuary/v3321-sanctuary-customize.js
          cmp pages-release/v3322/main-recovery.js _site/v3322-main-recovery.js
          cmp pages-release/v3322/sanctuary-recovery.js _site/sanctuary/v3322-sanctuary-recovery.js
          cmp pages-release/v3325/sanctuary-visual-authority.js _site/sanctuary/v3325-sanctuary-visual-authority.js
          cmp pages-release/v3317/guardian-care-economy.js _site/guardian-care-economy.js

          # Golden architecture and protected assets.
          grep -q '"build_foundation": "V3.3.18 Golden Baseline"' _site/app-progress.json
          grep -q '"version": "V3.3.33 WGU Practice Lab"' _site/app-progress.json
          grep -q 'learning-lab.js?v=3319' _site/index.html
          grep -q 'learning-lab.css?v=3319' _site/index.html
          grep -q 'learning-plan.js?v=3324' _site/index.html
          grep -q 'learning-plan.css?v=3324' _site/index.html
          grep -q 'course-tutor.js?v=3326' _site/index.html
          grep -q 'course-tutor.css?v=3326' _site/index.html
          grep -q 'magical-college-home.js?v=3327' _site/index.html
          grep -q 'magical-college-home.css?v=3327' _site/index.html
          grep -q 'wgu-practice.js?v=3333' _site/index.html
          grep -q 'wgu-practice.css?v=3333' _site/index.html
          grep -q '"sanctuary_version": "V3.3.25 Single Guardian Visual Authority"' _site/app-progress.json
          grep -q 'majick-state-core.js?v=3322-recovery' _site/index.html
          grep -q 'guardian-care-economy.js?v=3322-recovery' _site/index.html
          grep -q 'v3317-main.js?v=3322-recovery' _site/index.html
          grep -q 'v3322-main-recovery.js?v=3322' _site/index.html
          grep -q 'v3320-sanctuary-life.js?v=3322-recovery' _site/sanctuary/index.html
          grep -q 'v3321-sanctuary-customize.js?v=3322-recovery' _site/sanctuary/index.html
          grep -q 'v3322-sanctuary-recovery.js?v=3322' _site/sanctuary/index.html
          grep -q 'v3325-sanctuary-visual-authority.js?v=3325' _site/sanctuary/index.html
          grep -q '"historical_patch_chain": "retired from deployment"' _site/app-progress.json
          test "$(find _site/sanctuary/assets/motion -type f -name '*.png' | wc -l)" -eq 33
          test "$(find _site/sanctuary/assets/runtime-motion -type f -name '*.webp' | wc -l)" -eq 33
          test "$(find _site/sanctuary/assets/objects -type f -name '*.webp' | wc -l)" -ge 9
          test "$(find _site/sanctuary/assets/runtime-objects -type f -name '*.webp' | wc -l)" -ge 15
          test "$(find _site/sanctuary/assets/evolutions -type f -name '*.webp' | wc -l)" -ge 60
          test "$(find _site/assets/familiars/evolution_stages -type f -name '*.webp' | wc -l)" -eq 50
          test -s _site/assets/familiars/evolution_stages/velora-new-bond.webp
          test -s _site/assets/familiars/evolution_stages/solara-celestial.webp
          test -s _site/sanctuary/assets/evolutions/velora/ascendant/play.webp
          test -s _site/sanctuary/assets/evolutions/cascade/celestial/sleep.webp

          node --check _site/guardian-registry.js
          node --check _site/majick-state-core.js
          node --check _site/learning-lab.js
          node --check _site/learning-plan.js
          node --check _site/course-tutor.js
          node --check _site/magical-college-home.js
          node --check _site/wgu-practice.js
          node --check _site/courseManager.js
          node --check _site/guardian-care-economy.js
          node --check _site/v3317-main.js
          node --check _site/sanctuary/v3317-sanctuary.js
          node --check _site/sanctuary/v3320-sanctuary-life.js
          node --check _site/sanctuary/v3321-sanctuary-customize.js
          node --check _site/v3322-main-recovery.js
          node --check _site/sanctuary/v3322-sanctuary-recovery.js
          node --check _site/sanctuary/v3325-sanctuary-visual-authority.js
          node --check _site/study-material/materialParser.js
          node --check _site/study-material/materialStoreModel.js
          node --check _site/study-material/questionBuilder.js
          node --check _site/study-material/AddStudyMaterialPage.js

          python - <<'PY'
          from pathlib import Path
          n=sum(p.stat().st_size for p in Path('_site/sanctuary/assets/runtime-motion').glob('*.webp'))
          assert n < 4*1024*1024, n
          print('runtime motion bytes',n)
          PY

          python pages-release/stability-reset/stability-reset-verify.py _site
          echo "Majick Studies V3.3.33 Golden Baseline overlay assembly passed."

      - name: V3.3.33 WGU practice regression gate
        shell: bash
        run: |
          set -euo pipefail
          node --check pages-release/v3333/wgu-practice-smoke.js
          node pages-release/v3333/wgu-practice-smoke.js

          # Keep the legacy full-browser smoke available for manual regression work,
          # but do not let its monolithic legacy boot freeze every Pages release.
          echo "Targeted WGU Practice Lab runtime gate passed."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Clear stale Pages deployments
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for BUILD in \
            6a777abd14ec4fece39ee855bae3556f5d22158d \
            04d0bcafc01f258bcf33f1fde7e268dc75a89a7c \
            e25dd73d058f6bce22eb3297b6ab174848933523
          do
            CODE="$(curl -sS -o /tmp/pages-cancel.json -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${BUILD}/cancel" || true)"
            echo "Pages cancel ${BUILD}: HTTP ${CODE}"
            case "$CODE" in
              204|404|409|422) ;;
              *) cat /tmp/pages-cancel.json || true; echo "Unexpected Pages cancel response: $CODE"; exit 1 ;;
            esac
          done

      - name: Request Pages OIDC token
        id: pages_oidc
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken()
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Create GitHub Pages deployment
        id: deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OIDC_TOKEN: ${{ steps.pages_oidc.outputs.token }}
          ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$OIDC_TOKEN"
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          oidc=os.environ['OIDC_TOKEN']
          artifact=int(os.environ['ARTIFACT_ID'])
          sha=os.environ['GITHUB_SHA']
          payload=json.dumps({
              'artifact_id':artifact,
              'pages_build_version':sha,
              'oidc_token':oidc,
          }).encode('utf-8')
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/pages/deployments',
              data=payload,
              method='POST',
              headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':'Bearer '+token,
                  'X-GitHub-Api-Version':'2026-03-10',
                  'Content-Type':'application/json',
              },
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              response=json.loads(r.read().decode('utf-8'))
          page_url=response.get('page_url') or 'https://rnw4512-dev.github.io/majick-studies-assets/'
          status_url=response.get('status_url') or ''
          deploy_id=response.get('id') or sha
          print('Created Pages deployment:',deploy_id)
          print('Pages status URL:',status_url)
          print('Pages URL:',page_url)
          out=os.environ['GITHUB_OUTPUT']
          with open(out,'a',encoding='utf-8') as fh:
              fh.write('page_url='+page_url+'\n')
              fh.write('status_url='+status_url+'\n')
              fh.write('deployment_id='+str(deploy_id)+'\n')
          PY

      - name: Verify live Pages deployment
        timeout-minutes: 12
        shell: bash
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
          STATUS_URL: ${{ steps.deployment.outputs.status_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Waiting for V3.3.33 at $LIVE_URL"
          python - <<'PY'
          import json,time,urllib.request,urllib.error,os
          base=(os.environ.get('LIVE_URL') or 'https://rnw4512-dev.github.io/majick-studies-assets/').rstrip('/')+'/'
          status_url=os.environ.get('STATUS_URL','')
          token=os.environ.get('GH_TOKEN','')
          expected='V3.3.33 WGU Practice Lab'
          last=None
          for attempt in range(1,121):
              try:
                  if status_url and attempt%3==1:
                      req=urllib.request.Request(status_url,headers={
                          'Accept':'application/vnd.github+json',
                          'Authorization':'Bearer '+token,
                          'X-GitHub-Api-Version':'2026-03-10',
                      })
                      with urllib.request.urlopen(req,timeout=10) as r:
                          st=json.loads(r.read().decode('utf-8'))
                      print('Pages deployment status:',st.get('status'))
                  stamp=str(attempt)+'-'+str(int(time.time()))
                  with urllib.request.urlopen(base+'app-progress.json?smoke='+stamp,timeout=10) as r:
                      data=json.loads(r.read().decode('utf-8'))
                  with urllib.request.urlopen(base+'index.html?smoke='+stamp,timeout=10) as r:
                      index=r.read().decode('utf-8','replace')
                  with urllib.request.urlopen(base+'wgu-practice.js?smoke='+stamp,timeout=10) as r:
                      practice=r.read().decode('utf-8','replace')
                  last=(data.get('version'), 'wgu-practice.js?v=3333' in index, "VERSION='3.3.33'" in practice)
                  if last==(expected,True,True):
                      print('LIVE V3.3.33 DEPLOYMENT VERIFIED')
                      raise SystemExit(0)
                  print('Live version not ready yet:',last)
              except Exception as e:
                  last=repr(e)
                  print('Live check waiting:',last)
              time.sleep(5)
          raise SystemExit('Pages deployment was created and left active, but the live site did not expose V3.3.33 within 10 minutes: '+repr(last))
          PY
