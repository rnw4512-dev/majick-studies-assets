name: Deploy Majick Studies to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages-release/**'
      - '.github/workflows/deploy-majick-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: majick-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify release parts
        shell: bash
        run: |
          set -euo pipefail
          test -f pages-release/majick-pages-part-01.zip
          test -f pages-release/majick-pages-part-02.zip
          test -f pages-release/majick-pages-part-03.zip
          test -f pages-release/majick-pages-part-04.zip

      - name: Assemble Majick Studies site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          for part in pages-release/majick-pages-part-*.zip; do
            unzip -oq "$part" -d _site
          done
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/sanctuary/index.html
          echo "Majick Studies site assembled successfully."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
