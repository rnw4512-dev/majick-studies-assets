name: Recalculate Atelier sprite integration integrity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-atelier-integrity.yml'
      - 'current-site/atelier-sprite-actions.js'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair-atelier-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculate SHA-256 from exact repository bytes
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          base=Path('current-site')
          manifest_path=base/'source-manifest.json'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          for relative in ('index.html','atelier-sprite-actions.js','assets/atelier/v2/sprites/sprite-audit.json'):
              path=base/relative
              assert path.is_file(), 'Missing: '+relative
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              manifest['files'][relative]=digest
              print(relative,digest)
          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Commit manifest if necessary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-site/source-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Calculate exact SHA-256 of Atelier integration"
            git push
          fi
      - name: Trigger canonical Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-majick-pages.yml --ref main
