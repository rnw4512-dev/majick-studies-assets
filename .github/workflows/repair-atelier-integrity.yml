name: Verify Atelier sprite integration integrity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-atelier-integrity.yml'
      - 'current-site/atelier-sprite-actions.js'
      - 'current-site/atelier-fit-review.html'
      - 'current-site/atelier-v2-approval-gate.js'
      - 'current-site/game-realm.js'
      - 'current-site/course-tutor.js'
      - 'current-site/d772-shared-oa-questions.js'
      - 'current-site/index.html'
      - 'current-site/assets/atelier/v3/sprite-registry.json'
      - 'current-site/assets/atelier/v2/fitted/approval-registry.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-atelier-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit reviewed source digests without rewriting approvals
        run: python pages-release/current/review_manifest.py
