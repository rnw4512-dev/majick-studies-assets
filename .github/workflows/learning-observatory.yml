name: Learning Observatory checks

on:
  pull_request:
    paths:
      - 'current-site/learning-observatory.js'
      - 'current-site/game-realm.js'
      - 'current-site/solution-engine.js'
      - 'current-site/tests/learning-observatory.test.cjs'
      - 'current-site/tests/learning_observatory_browser.py'
      - 'current-site/source-manifest.json'
      - '.github/workflows/learning-observatory.yml'
  push:
    branches: [main]
    paths:
      - 'current-site/learning-observatory.js'
      - 'current-site/game-realm.js'
      - 'current-site/solution-engine.js'
      - 'current-site/tests/learning-observatory.test.cjs'

jobs:
  unit:
    name: Learning evidence unit checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check current-site/learning-observatory.js
          node --check current-site/game-realm.js
          node --check current-site/solution-engine.js
      - name: Learning Observatory regression tests
        run: node --test current-site/tests/learning-observatory.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium browser testing tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build verified production site from canonical sources
        run: python pages-release/current/build.py current-site _site
      - name: Start local release server and test the Observatory at 390px, 820px and 1366px
        run: |
          python -m http.server 8765 --directory _site > /tmp/aetheria-observatory-server.log 2>&1 &
          python current-site/tests/learning_observatory_browser.py

