name: Collegium Commons review
on:
  pull_request:
    paths:
      - 'current-site/**'
      - 'pages-release/current/**'
      - '.github/workflows/commons-review.yml'
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical release checks
        run: node pages-release/current/release-checks.cjs current-site
      - name: Commons deterministic regression
        run: node pages-release/current/test-collegium-commons.cjs current-site
      - name: Preassessment regression
        run: node pages-release/current/test-d772-preassessment.cjs current-site
      - name: Adaptive mastery regression
        run: node pages-release/current/test-d772-adaptive.cjs current-site
      - name: Canonical build
        run: python pages-release/current/build.py current-site _site
      - name: Commons rendered audit and screenshots
        run: timeout 150s node pages-release/current/browser-commons.cjs _site
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commons-visual-audit
          path: commons-qa/
      - name: Full interaction regression
        if: always()
        run: timeout 150s node pages-release/current/browser-interactions.cjs _site
      - name: Connected probability regression
        if: always()
        run: timeout 150s node pages-release/current/browser-probability.cjs _site
