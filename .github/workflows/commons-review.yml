name: Collegium Commons review
on:
  pull_request:
    paths:
      - 'current-site/**'
      - 'pages-release/current/**'
      - '.github/workflows/commons-review.yml'
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: [1366, 820, 390]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical release checks
        run: node pages-release/current/release-checks.cjs current-site
      - name: Animation safety regression (desktop tablet mobile)
        run: node pages-release/current/test-animation-effects.cjs current-site
      - name: Commons deterministic regression
        run: node pages-release/current/test-collegium-commons.cjs current-site
      - name: Preassessment regression
        run: node pages-release/current/test-d772-preassessment.cjs current-site
      - name: Adaptive mastery regression
        run: node pages-release/current/test-d772-adaptive.cjs current-site
      - name: Cross-room D772 weakness and mastery safety regression
        run: node pages-release/current/test-d772-cross-room.cjs current-site
      - name: Generated D772 academic accuracy regression
        run: node pages-release/current/test-d772-generated-depth.cjs current-site
      - name: Practice clear and resubmit regression
        run: node pages-release/current/test-practice-retry-controls.cjs current-site
      - name: Compact Home tabs and room section navigation regression
        run: node pages-release/current/test-compact-navigation.cjs current-site
      - name: Canonical build
        run: python pages-release/current/build.py current-site _site
      - name: Commons rendered audit and screenshots
        env:
          COMMONS_WIDTH: ${{ matrix.width }}
        run: timeout 480s node pages-release/current/browser-commons.cjs _site
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commons-visual-audit-${{ matrix.width }}
          path: commons-qa/
      - name: Full interaction regression
        if: always() && matrix.width == 1366
        run: timeout 150s node pages-release/current/browser-interactions.cjs _site
      - name: Connected probability regression
        if: always() && matrix.width == 1366
        run: timeout 150s node pages-release/current/browser-probability.cjs _site
