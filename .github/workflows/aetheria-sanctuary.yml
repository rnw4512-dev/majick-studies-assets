name: Aetheria Sanctuary acceptance
on:
  pull_request:
    paths: ['current-site/**', 'tests/aetheria-sanctuary-browser.py', '.github/workflows/aetheria-sanctuary.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sanctuary-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.56.0
      - run: python pages-release/current/build.py current-site _site
      - name: Shared avatar, exact saved identities, viewport, missing artwork and confirmed repair
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          RECOVERY_EVIDENCE: sanctuary-evidence
        run: python -u tests/aetheria-sanctuary-browser.py _site
      - name: Existing care, furniture, motion and Phaser fallback regression
        env:
          SANCTUARY_QA_DIR: sanctuary-evidence/existing
        run: node pages-release/current/browser-sanctuary.cjs _site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanctuary-browser-evidence
          path: sanctuary-evidence
