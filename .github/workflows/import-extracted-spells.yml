name: Integrate extracted spell artwork
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-extracted-spells.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install Pillow==11.3.0
      - name: Import verified artwork and connect existing controls
        run: |
          python - <<'PY'
          import json, hashlib, re, shutil
          from pathlib import Path
          from PIL import Image
          root=Path('current-site')
          dest=root/'assets/imported-artwork/spell-icons'
          dest.mkdir(parents=True,exist_ok=True)
          manifest=root/'source-manifest.json'
          data=json.loads(manifest.read_text())
          catalog=json.loads(Path('manifest.json').read_text())
          copied=[]
          for entry in catalog.values():
              name=entry['file']
              if not re.fullmatch(r'(explosion|frame|horror|leaf|runes|wild|wind)-[a-z0-9-]+\.webp',name): raise ValueError(name)
              src=Path(name)
              if not src.exists(): continue
              with Image.open(src) as im:
                  assert im.format=='WEBP' and im.size==(128,128)
                  im.verify()
              target=dest/name
              if target.exists() and target.read_bytes()!=src.read_bytes(): raise ValueError(name)
              shutil.copyfile(src,target)
              copied.append(target)
          if not copied: raise ValueError('No uploaded spell images')
          credit=dest/'LICENSE.txt'
          credit.write_text('Painterly Spell Icons Part 3 — J. W. Bjerk (eleazzaar). CC BY 3.0. Source: https://opengameart.org/content/painterly-spell-icons-part-3 . License: https://creativecommons.org/licenses/by/3.0/ . Adaptation: resized and converted to WebP.\n')
          css=root/'licensed-assets.css'
          marker='/* Uploaded painterly spell artwork integration */'
          block="""
          /* Uploaded painterly spell artwork integration */
          .side .nav button[data-nav=constellation]>span:first-child:not(.label){background-image:url('./assets/imported-artwork/spell-icons/runes-blue-1.webp')!important}
          .side .nav button[data-nav=reasoning]>span:first-child:not(.label){background-image:url('./assets/imported-artwork/spell-icons/runes-orange-1.webp')!important}
          .side .nav button[data-nav=games]>span:first-child:not(.label){background-image:url('./assets/imported-artwork/spell-icons/runes-royal-1.webp')!important}
          #aethAdventure .aeth-runes button>span[aria-hidden=true]{background-image:url('./assets/imported-artwork/spell-icons/runes-blue-2.webp')!important}
          #aethAdventure .aeth-runes .aeth-target>span[aria-hidden=true]{background-image:url('./assets/imported-artwork/spell-icons/runes-magenta-1.webp')!important}
          #content[data-majick-room=game] .majRoomEmblem{background-image:url('./assets/imported-artwork/spell-icons/runes-royal-2.webp')!important}
          #content[data-majick-room=learninglab] .majRoomEmblem{background-image:url('./assets/imported-artwork/spell-icons/runes-magenta-2.webp')!important}
          #content[data-majick-room=sanctuary] .majRoomEmblem{background-image:url('./assets/imported-artwork/spell-icons/leaf-jade-1.webp')!important}
          """
          for name in re.findall(r'spell-icons/([a-z0-9-]+\.webp)',block): assert (dest/name).exists(),name
          if marker not in css.read_text(): css.write_text(css.read_text()+'\n'+block)
          for p in copied+[credit,css]: data['files'][p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          manifest.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          print('Registered',len(copied),'spell illustrations')
          PY
      - name: Commit and request publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-site/assets/imported-artwork current-site/licensed-assets.css current-site/source-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Integrate painterly spells in room navigation and rune controls"
            git push origin HEAD:main
          fi
          gh workflow run publish-aetheria.yml --ref main
