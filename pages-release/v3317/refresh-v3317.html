<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Majick Studies — Refreshing V3.3.17</title>
<style>
  html,body{height:100%;margin:0;background:#120a1d;color:#f7e4b0;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  body{display:grid;place-items:center;padding:24px}
  .card{max-width:620px;text-align:center;padding:32px;border:1px solid rgba(244,211,148,.35);border-radius:24px;background:linear-gradient(160deg,#21112f,#171024);box-shadow:0 24px 80px rgba(0,0,0,.35)}
  h1{font-family:Georgia,serif;margin:0 0 10px;font-size:34px}
  p{color:#d9cfe3;line-height:1.55}
  .sigil{font-size:54px;margin-bottom:8px}
  .status{margin-top:16px;color:#ffe3a0;font-weight:800}
</style>
</head>
<body>
<div class="card">
  <div class="sigil">☾ ✦</div>
  <h1>Refreshing Majick Studies</h1>
  <p>This one-time launcher clears older Majick Studies caches and removes the old service worker so V3.3.17 can load cleanly.</p>
  <div class="status" id="status">Preparing V3.3.17…</div>
</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('majick-studies-')).map(k=>caches.delete(k)));
    }
    try{
      sessionStorage.setItem('majick_v3317_cache_reset',new Date().toISOString());
    }catch(_){}
    status.textContent='Cache cleared. Opening V3.3.17…';
    const stamp=Date.now();
    location.replace('./?majick_release=3317&fresh='+stamp);
  }catch(err){
    status.textContent='Opening V3.3.17 with a fresh URL…';
    setTimeout(()=>location.replace('./?majick_release=3317&fresh='+Date.now()),250);
  }
})();
</script>
</body>
</html>
